<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f18">
<title>Apocalypse</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden;
    font-family:"Courier New",monospace;color:#dfe5ee;touch-action:none;user-select:none;
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh;}
  #wrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;
    background:radial-gradient(circle at 50% 35%,#141b2b 0%,#05070c 75%);padding:6px;}
  #stage{position:relative;display:block;line-height:0;
    border:2px solid #2a3346;box-shadow:0 0 0 2px #05070c,0 8px 28px rgba(0,0,0,.7);background:#05070c;}
  #screen{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#05070c;}
  #text{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;
    image-rendering:auto;}
  #pad{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));gap:10px;background:#080b12;
    border-top:1px solid #1b2231;}
  .dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,42px);gap:3px;}
  .btn{display:flex;align-items:center;justify-content:center;background:#1e2636;color:#cfd8e6;
    border:1px solid #3a465e;border-radius:8px;cursor:pointer;
    font:700 17px "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    transition:background .06s,transform .06s;}
  .btn.on{background:#3a4a68;color:#f0d05a;transform:translateY(1px);}
  .round{width:58px;height:58px;border-radius:50%;font-size:19px;}
  .acts{display:flex;align-items:center;gap:10px;}
  #btn-m{width:auto;padding:0 14px;height:38px;border-radius:6px;font-size:14px;letter-spacing:1.5px;}
  .sp{visibility:hidden;}
  @media (min-width:900px) and (min-height:700px){ #pad{opacity:.85;} }
</style>
</head>
<body>
<div id="app">
  <div id="wrap"><div id="stage"><canvas id="screen" width="320" height="240"></canvas><canvas id="text"></canvas></div></div>
  <div id="pad">
    <div class="dpad">
      <div class="btn sp"></div><div class="btn" id="btn-up">&#9650;</div><div class="btn sp"></div>
      <div class="btn" id="btn-left">&#9664;</div><div class="btn sp"></div><div class="btn" id="btn-right">&#9654;</div>
      <div class="btn sp"></div><div class="btn" id="btn-down">&#9660;</div><div class="btn sp"></div>
    </div>
    <div class="btn" id="btn-m">MENU</div>
    <div class="acts">
      <div class="btn round" id="btn-b">B</div>
      <div class="btn round" id="btn-a">A</div>
    </div>
  </div>
</div>
<script>
/* ============================================================
   APOCALYPSE - a single-file 16-bit style browser JRPG
   ============================================================ */
(function(){
'use strict';

var W = 320, H = 240, TS = 16;
var cv, ctx, scale = 1;

/* ---------- tiny deterministic RNG ---------- */
function LCG(seed){ this.s = seed >>> 0; }
LCG.prototype.next = function(){ this.s = (this.s * 1664525 + 1013904223) >>> 0; return this.s / 4294967296; };
LCG.prototype.int = function(n){ return Math.floor(this.next() * n); };
function rnd(n){ return Math.floor(Math.random() * n); }
function pick(a){ return a[rnd(a.length)]; }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

/* ---------- pixel helpers ---------- */
function mk(w,h){ var c = document.createElement('canvas'); c.width = w; c.height = h; var x = c.getContext('2d'); x.imageSmoothingEnabled = false; return { c:c, x:x }; }
function px(x,cx,cy,w,h,col){ x.fillStyle = col; x.fillRect(cx,cy,w,h); }

/* ============================================================
   TILE ART
   ============================================================ */
var TILE = {};
var T_WATER=0,T_GRASS=1,T_FOREST=2,T_MOUNT=3,T_SAND=4,T_SNOW=5,T_ROAD=6,T_LAVA=7,
    T_HILL=8,T_TOWN=9,T_CAVE=10,T_BRIDGE=11,T_FLOOR=12,T_WALL=13,T_DOOR=14,T_INN=15,
    T_SHOP=16,T_TREE=17,T_ROOF=18,T_EXIT=19,T_CHEST=20,T_STAIR=21,T_PATH=22,T_THRONE=23,
    T_ICE=24,T_DUNE=25,T_FLOWER=26,T_FENCE=27,T_SIGN=28,T_WELL=29,T_FIR=30,T_CRYPT=31,
    T_COFFIN=32,T_ALTAR=33,T_BURNT=34,T_BITTER=35,
    T_COBBLE=36,T_BRICKPATH=37,T_STONEWALL=38,T_WOODFLOOR=39,T_MARKET=40,T_LAMP=41,
    T_FOUNTAIN=42,T_STATUE=43,T_HEDGE=44,T_PLANTER=45,T_CRATE=46,T_BARREL=47,
    T_STEPS=48,T_GARDEN=49,T_AWNING=50,T_ROOFBLUE=51,T_ROOFGREEN=52,
    T_MARSH=53,T_RUINS=54,T_OASIS=55,T_CLIFF=56,T_ORCHARD=57,T_FARM=58,T_DOCK=59;

function noise(g,n,cols,seed){
  var r = new LCG(seed);
  for(var i=0;i<n;i++){ px(g,r.int(TS),r.int(TS),1,1,cols[r.int(cols.length)]); }
}
function buildTiles(){
  function T(id,fn){ var g = mk(TS,TS); fn(g.x); TILE[id] = g.c; }
  T(T_GRASS,function(x){ px(x,0,0,TS,TS,'#4c9a3a'); noise(x,26,['#59ad44','#3f8531'],7); px(x,3,10,2,1,'#6dc253'); px(x,11,4,2,1,'#6dc253'); });
  T(T_FLOWER,function(x){ px(x,0,0,TS,TS,'#4c9a3a'); noise(x,20,['#59ad44','#3f8531'],9); px(x,4,5,2,2,'#e8637d'); px(x,10,10,2,2,'#f0d05a'); px(x,3,11,2,2,'#7ec8f5'); });
  T(T_FOREST,function(x){ px(x,0,0,TS,TS,'#3f8531'); function tree(ox,oy,s){ px(x,ox+2,oy+9,2,3,'#5a3a20'); px(x,ox,oy+2,7,7,'#2f6b28'); px(x,ox+1,oy+1,5,7,s); px(x,ox+2,oy+3,2,2,'#63c04c'); }
    tree(0,0,'#3f8f34'); tree(8,3,'#357c2c'); });
  T(T_TREE,function(x){ px(x,0,0,TS,TS,'#4c9a3a'); noise(x,14,['#59ad44'],3); px(x,6,11,3,4,'#5a3a20'); px(x,2,1,11,11,'#2f6b28'); px(x,3,2,9,9,'#3f8f34'); px(x,5,4,3,3,'#63c04c'); });
  T(T_MOUNT,function(x){ px(x,0,0,TS,TS,'#4c9a3a'); px(x,0,3,TS,13,'#6e6a63'); px(x,2,5,12,11,'#8a867d'); px(x,4,2,8,6,'#9d9a92'); px(x,6,1,4,4,'#c9c6bd'); px(x,3,9,3,2,'#5c584f'); px(x,10,11,3,2,'#5c584f'); });
  T(T_HILL,function(x){ px(x,0,0,TS,TS,'#4c9a3a'); px(x,1,6,14,9,'#417f33'); px(x,3,4,10,6,'#4f9a3c'); noise(x,12,['#5cb046'],11); });
  T(T_WATER,function(x){ px(x,0,0,TS,TS,'#2a6bb5'); noise(x,18,['#3a80cc','#22589a'],5); px(x,2,4,5,1,'#79b7ee'); px(x,9,10,4,1,'#79b7ee'); });
  T(T_SAND,function(x){ px(x,0,0,TS,TS,'#dfc888'); noise(x,22,['#ead9a2','#cbb173'],13); });
  T(T_DUNE,function(x){ px(x,0,0,TS,TS,'#dfc888'); px(x,0,7,TS,9,'#cbb173'); px(x,2,5,11,5,'#ead9a2'); noise(x,10,['#f2e3b4'],17); });
  T(T_SNOW,function(x){ px(x,0,0,TS,TS,'#e8eef5'); noise(x,16,['#ffffff','#cdd8e4'],19); });
  T(T_ICE,function(x){ px(x,0,0,TS,TS,'#bcdcf0'); px(x,1,1,6,6,'#d9eefb'); px(x,8,8,6,6,'#a6cbe6'); });
  T(T_ROAD,function(x){ px(x,0,0,TS,TS,'#c2a878'); noise(x,20,['#d3bd90','#a98f63'],23); });
  T(T_PATH,function(x){ px(x,0,0,TS,TS,'#b99a6b'); noise(x,18,['#caae82','#a2855b'],29); });
  T(T_LAVA,function(x){ px(x,0,0,TS,TS,'#8f2410'); noise(x,24,['#e2591a','#f7a331'],31); px(x,3,6,6,2,'#ffd35e'); });
  T(T_BRIDGE,function(x){ px(x,0,0,TS,TS,'#2a6bb5'); px(x,0,2,TS,12,'#8a6033'); for(var i=0;i<TS;i+=4) px(x,i,2,1,12,'#6a4724'); px(x,0,2,TS,1,'#a87b47'); px(x,0,13,TS,1,'#a87b47'); });
  T(T_FLOOR,function(x){ px(x,0,0,TS,TS,'#6b6259'); noise(x,20,['#7a7066','#5b534b'],37); });
  T(T_WALL,function(x){ px(x,0,0,TS,TS,'#3c3630'); px(x,1,1,6,6,'#564e45'); px(x,8,1,7,6,'#4d463e'); px(x,1,8,7,7,'#4d463e'); px(x,9,8,6,7,'#564e45'); });
  T(T_STAIR,function(x){ px(x,0,0,TS,TS,'#544c44'); for(var i=0;i<4;i++){ px(x,2,2+i*3,12,2,'#8b8177'); px(x,2,4+i*3,12,1,'#3a342e'); } });
  T(T_ROOF,function(x){ px(x,0,0,TS,TS,'#a83a30'); for(var i=0;i<TS;i+=4){ px(x,0,i,TS,1,'#7d271f'); } px(x,0,0,TS,2,'#c9564a'); });
  T(T_DOOR,function(x){ px(x,0,0,TS,TS,'#c8b48c'); px(x,3,3,10,13,'#6b4526'); px(x,4,4,8,12,'#8a5c33'); px(x,10,10,2,2,'#e6c463'); });
  T(T_INN,function(x){ px(x,0,0,TS,TS,'#c8b48c'); px(x,3,3,10,13,'#4b6f9c'); px(x,4,4,8,12,'#6690c4'); px(x,10,10,2,2,'#e6c463'); px(x,5,1,6,2,'#f0d05a'); });
  T(T_SHOP,function(x){ px(x,0,0,TS,TS,'#c8b48c'); px(x,3,3,10,13,'#5f8a4c'); px(x,4,4,8,12,'#7cae64'); px(x,10,10,2,2,'#e6c463'); px(x,5,1,6,2,'#e88c3a'); });
  T(T_TOWN,function(x){ px(x,0,0,TS,TS,'#4c9a3a'); px(x,2,7,12,8,'#c8b48c'); px(x,1,3,14,5,'#a83a30'); px(x,6,10,4,5,'#6b4526'); px(x,3,9,2,2,'#7ec8f5'); px(x,11,9,2,2,'#7ec8f5'); });
  T(T_CAVE,function(x){ px(x,0,0,TS,TS,'#6e6a63'); px(x,1,2,14,13,'#8a867d'); px(x,4,6,8,9,'#171410'); px(x,5,5,6,3,'#0d0b09'); });
  T(T_EXIT,function(x){ px(x,0,0,TS,TS,'#4c9a3a'); noise(x,18,['#59ad44'],41); px(x,1,6,14,4,'#c2a878'); });
  T(T_CHEST,function(x){ px(x,0,0,TS,TS,'#6b6259'); px(x,2,5,12,9,'#7a4f22'); px(x,2,5,12,3,'#a8712f'); px(x,7,8,2,3,'#e6c463'); px(x,2,5,12,1,'#d19a4a'); });
  T(T_THRONE,function(x){ px(x,0,0,TS,TS,'#4a4038'); px(x,4,2,8,12,'#6d2b57'); px(x,5,3,6,4,'#93407a'); px(x,3,12,10,3,'#c8a94a'); });
  T(T_FENCE,function(x){ px(x,0,0,TS,TS,'#4c9a3a'); px(x,0,6,TS,2,'#9a7647'); px(x,2,3,2,10,'#7d5c34'); px(x,11,3,2,10,'#7d5c34'); });
  T(T_SIGN,function(x){ px(x,0,0,TS,TS,'#4c9a3a'); px(x,7,8,2,6,'#7d5c34'); px(x,2,3,12,6,'#c0975c'); px(x,3,5,10,1,'#6b4526'); px(x,3,7,7,1,'#6b4526'); });
  T(T_FIR,function(x){ px(x,0,0,TS,TS,'#2f6b28'); noise(x,16,['#27591f'],53);
    px(x,7,11,3,5,'#4a3320'); px(x,4,9,8,3,'#1e4a1a'); px(x,3,6,10,4,'#245a20');
    px(x,5,3,6,4,'#1e4a1a'); px(x,6,0,4,4,'#2a6b26'); px(x,7,7,2,2,'#0a0a0a');
    px(x,6,6,1,1,'#e8e4d8'); px(x,9,6,1,1,'#e8e4d8'); });
  T(T_CRYPT,function(x){ px(x,0,0,TS,TS,'#c8b48c'); px(x,2,2,12,14,'#5c5a55');
    px(x,4,5,8,11,'#2a2724'); px(x,5,7,6,9,'#171512');
    px(x,7,3,2,7,'#c8ced8'); px(x,5,5,6,2,'#c8ced8'); });
  T(T_COFFIN,function(x){ px(x,0,0,TS,TS,'#6b6259'); px(x,3,1,10,14,'#4a3626');
    px(x,4,2,8,12,'#6b4a2e'); px(x,6,4,4,2,'#c8ced8'); px(x,7,3,2,6,'#c8ced8');
    px(x,4,12,8,2,'#3a2a1c'); });
  T(T_ALTAR,function(x){ px(x,0,0,TS,TS,'#4a4038'); px(x,2,6,12,8,'#8a867d');
    px(x,3,4,10,3,'#a8a49b'); px(x,6,1,4,4,'#e8e4d8'); px(x,7,0,2,6,'#e8e4d8'); });
  T(T_BURNT,function(x){ px(x,0,0,TS,TS,'#3a332c'); noise(x,26,['#4a4038','#241f1a'],61);
    px(x,3,6,2,8,'#1a1614'); px(x,9,4,2,10,'#1a1614'); px(x,6,9,2,5,'#241f1a');
    px(x,2,14,12,2,'#2a241f'); px(x,11,7,1,3,'#6b3a1a'); });
  T(T_BITTER,function(x){ px(x,0,0,TS,TS,'#3f4a24'); noise(x,20,['#55632f','#2a3218'],67);
    px(x,2,4,5,1,'#8aa04a'); px(x,9,10,4,1,'#8aa04a'); px(x,6,7,3,2,'#1f2612'); });
  /* --- paving and city dressing --- */
  T(T_COBBLE,function(x){ px(x,0,0,TS,TS,'#8a8378');
    for(var r0=0;r0<4;r0++) for(var c0=0;c0<4;c0++){
      var ox=c0*4+((r0%2)?2:0), oy=r0*4;
      px(x,ox%TS,oy,3,3,(r0+c0)%3?'#9a9288':'#7c7469'); px(x,ox%TS,oy+3,3,1,'#615b52'); } });
  T(T_BRICKPATH,function(x){ px(x,0,0,TS,TS,'#a8663f');
    for(var r1=0;r1<4;r1++){ var off=(r1%2)*4;
      for(var c1=-1;c1<3;c1++) px(x,c1*8+off,r1*4,7,3,r1%2?'#b8734a':'#9c5c37'); }
    px(x,0,0,TS,TS,'rgba(0,0,0,0)'); noise(x,10,['#c07f52','#8a4f2f'],83); });
  T(T_STONEWALL,function(x){ px(x,0,0,TS,TS,'#6e6a63');
    px(x,0,0,TS,7,'#8a867d'); px(x,0,8,TS,7,'#7c786f');
    px(x,0,7,TS,1,'#4f4b45'); px(x,0,15,TS,1,'#4f4b45');
    px(x,5,0,1,7,'#4f4b45'); px(x,11,8,1,7,'#4f4b45'); noise(x,10,['#9a968d'],89); });
  T(T_WOODFLOOR,function(x){ px(x,0,0,TS,TS,'#8a5f36');
    for(var i2=0;i2<TS;i2+=4){ px(x,0,i2,TS,3,i2%8?'#96693c':'#7d5530'); px(x,0,i2+3,TS,1,'#5c3d21'); }
    px(x,7,0,1,TS,'#5c3d21'); });
  T(T_MARKET,function(x){ px(x,0,0,TS,TS,'#4c9a3a'); px(x,1,7,14,8,'#8a5f36');
    px(x,0,3,TS,4,'#c83a3a'); px(x,0,3,TS,2,'#e05a5a');
    for(var m=0;m<4;m++) px(x,m*4,3,2,4,'#f0f0f0');
    px(x,3,9,4,3,'#e0c463'); px(x,9,9,4,3,'#7ec8f5'); });
  T(T_LAMP,function(x){ px(x,0,0,TS,TS,'#8a8378'); px(x,7,6,2,10,'#3a3a44');
    px(x,5,1,6,6,'#2a2a33'); px(x,6,2,4,4,'#ffe08a'); px(x,7,0,2,2,'#3a3a44');
    px(x,5,14,6,2,'#3a3a44'); });
  T(T_FOUNTAIN,function(x){ px(x,0,0,TS,TS,'#8a8378'); px(x,1,2,14,12,'#9a968d');
    px(x,3,4,10,8,'#2a6bb5'); px(x,4,5,8,6,'#3a80cc'); px(x,7,3,2,7,'#cfe6f5');
    px(x,5,7,2,1,'#79b7ee'); px(x,10,9,2,1,'#79b7ee'); });
  T(T_STATUE,function(x){ px(x,0,0,TS,TS,'#8a8378'); px(x,3,12,10,4,'#7c786f');
    px(x,5,3,6,10,'#c8c4bb'); px(x,6,1,4,4,'#dad6cd'); px(x,4,5,2,5,'#b4b0a7');
    px(x,10,5,2,5,'#b4b0a7'); px(x,7,2,1,1,'#5c584f'); px(x,9,2,1,1,'#5c584f'); });
  T(T_HEDGE,function(x){ px(x,0,0,TS,TS,'#2f6b28'); noise(x,26,['#3f8f34','#245a1f'],97);
    px(x,1,1,14,3,'#4a9e3c'); px(x,2,10,3,2,'#e8637d'); px(x,10,5,2,2,'#f0d05a'); });
  T(T_PLANTER,function(x){ px(x,0,0,TS,TS,'#8a8378'); px(x,2,8,12,7,'#8a5f36');
    px(x,2,8,12,2,'#a8763f'); px(x,3,3,10,6,'#3f8f34'); px(x,5,2,3,3,'#e8637d');
    px(x,9,4,3,3,'#f0d05a'); });
  T(T_CRATE,function(x){ px(x,0,0,TS,TS,'#8a8378'); px(x,1,2,14,13,'#8a5f36');
    px(x,1,2,14,2,'#a8763f'); px(x,1,13,14,2,'#5c3d21');
    px(x,7,2,2,13,'#6b4526'); px(x,1,7,14,2,'#6b4526'); });
  T(T_BARREL,function(x){ px(x,0,0,TS,TS,'#8a8378'); px(x,3,2,10,13,'#7d5530');
    px(x,2,4,12,2,'#4a4a52'); px(x,2,10,12,2,'#4a4a52');
    px(x,4,2,8,2,'#96693c'); px(x,5,3,2,10,'#96693c'); });
  T(T_STEPS,function(x){ px(x,0,0,TS,TS,'#8a8378');
    for(var st=0;st<4;st++){ px(x,0,st*4,TS,3,st%2?'#9a9288':'#7c7469'); px(x,0,st*4+3,TS,1,'#5c584f'); } });
  T(T_GARDEN,function(x){ px(x,0,0,TS,TS,'#6b4a2a'); noise(x,16,['#7c5730','#5a3d22'],101);
    for(var gcol=0;gcol<3;gcol++){ px(x,2+gcol*5,3,2,10,'#3f8f34'); px(x,1+gcol*5,6,4,2,'#4fa844');
      px(x,2+gcol*5,2,2,2,'#e0a63a'); } });
  T(T_AWNING,function(x){ px(x,0,0,TS,TS,'#c8b48c'); px(x,0,0,TS,6,'#3a6b9c');
    for(var aw=0;aw<4;aw++) px(x,aw*4,0,2,6,'#e8e4d8');
    px(x,0,6,TS,1,'#2a4a6b'); px(x,2,8,12,7,'#8a5f36'); });
  T(T_ROOFBLUE,function(x){ px(x,0,0,TS,TS,'#3a5f9c'); for(var b1=0;b1<TS;b1+=4) px(x,0,b1,TS,1,'#2a4574');

function shade(hex,amt){
  var n = parseInt(hex.slice(1),16);
  var r = clamp(((n>>16)&255)+amt,0,255), g = clamp(((n>>8)&255)+amt,0,255), b = clamp((n&255)+amt,0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* 16x16 overworld walker, 4 dirs x 2 frames */
function makeWalker(p){
  var sheet = mk(16*8,16), x = sheet.x;
  var skin = p.skin, hair = p.hair, body = p.body, trim = p.trim, boot = p.boot || '#3a2a1c';
  for(var d=0; d<4; d++){
    for(var f=0; f<2; f++){
      var ox = (d*2+f)*16, bob = f;
      // legs
      px(x, ox+5, 12-0, 2, 4-bob, boot); px(x, ox+9, 12+0, 2, 4-(1-bob), boot);
      // body
      px(x, ox+4, 7, 8, 6, body); px(x, ox+4, 7, 8, 1, shade(body,26)); px(x, ox+4, 11, 8, 1, shade(body,-30));
      px(x, ox+7, 8, 2, 5, trim);
      // arms
      px(x, ox+3, 8, 1, 4, skin); px(x, ox+12, 8, 1, 4, skin);
      // head
      px(x, ox+5, 2, 6, 6, skin);
      if(d===1){ px(x, ox+4, 1, 8, 5, hair); px(x, ox+5, 6, 6, 2, hair); }
      else { px(x, ox+4, 1, 8, 4, hair); px(x, ox+4, 1, 8, 1, shade(hair,30)); }
      // eyes
      if(d===0){ px(x, ox+6, 5, 1, 2, '#1b1b22'); px(x, ox+9, 5, 1, 2, '#1b1b22'); }
      if(d===2){ px(x, ox+5, 5, 1, 2, '#1b1b22'); }
      if(d===3){ px(x, ox+10, 5, 1, 2, '#1b1b22'); }
      // weapon hint
      if(p.wep === 'sword'){ px(x, ox+13, 5, 1, 7, '#d7dde8'); px(x, ox+12, 11, 3, 1, '#a08040'); }
      else if(p.wep === 'staff'){ px(x, ox+13, 3, 1, 10, '#8a5c33'); px(x, ox+12, 2, 3, 2, p.trim); }
      else if(p.wep === 'bow'){ px(x, ox+13, 4, 1, 8, '#8a5c33'); px(x, ox+14, 5, 1, 6, '#d8d0b0'); }
      else if(p.wep === 'gun'){ px(x, ox+12, 9, 4, 2, '#5a5a66'); px(x, ox+12, 11, 2, 2, '#3a3a44'); }

}

var WW = 110, WH = 84;
var world = null;

var SPECIAL_SITES = [{key:'firtree', x:30, y:22}];
function inEllipse(x,y,cx,cy,rx,ry){ var dx=(x-cx)/rx, dy=(y-cy)/ry; return dx*dx+dy*dy <= 1; }

function buildWorld(){
  var r = new LCG(20260728);
  var m = new Array(WH);
  var y,x;
  for(y=0;y<WH;y++){ m[y] = new Array(WW); for(x=0;x<WW;x++) m[y][x] = T_WATER; }
  /* landmasses */
  for(y=0;y<WH;y++) for(x=0;x<WW;x++){
    var land = inEllipse(x,y,44,42,40,32) || inEllipse(x,y,66,20,22,15) ||
               inEllipse(x,y,74,62,24,17) || inEllipse(x,y,96,36,13,16);
    if(land) m[y][x] = T_GRASS;
  }
  /* land bridges */
  for(x=58;x<72;x++) for(y=30;y<34;y++) m[y][x] = T_GRASS;
  for(x=62;x<78;x++) for(y=48;y<52;y++) m[y][x] = T_GRASS;
  for(x=84;x<98;x++) for(y=34;y<38;y++) m[y][x] = T_GRASS;
  /* biomes */
  for(y=0;y<WH;y++) for(x=0;x<WW;x++){
    if(m[y][x] === T_WATER) continue;
    if(inEllipse(x,y,68,18,24,16)) m[y][x] = T_SNOW;
    else if(inEllipse(x,y,76,62,26,18)) m[y][x] = T_SAND;
    else if(inEllipse(x,y,96,36,14,17)) m[y][x] = (r.next() < 0.16 ? T_LAVA : T_HILL);
  }
  /* forests + detail */
  for(y=0;y<WH;y++) for(x=0;x<WW;x++){
    var t = m[y][x], n = r.next();
    if(t === T_GRASS){
      var deep = inEllipse(x,y,34,28,16,12) || inEllipse(x,y,26,56,14,11) || inEllipse(x,y,52,58,12,9);
      if(deep && n < 0.62) m[y][x] = T_FOREST;
      else if(n < 0.10) m[y][x] = T_FOREST;
      else if(n < 0.14) m[y][x] = T_HILL;
      else if(n < 0.17) m[y][x] = T_FLOWER;
    } else if(t === T_SAND){
      if(n < 0.14) m[y][x] = T_DUNE; else if(n < 0.18) m[y][x] = T_MOUNT;
    } else if(t === T_SNOW){
      if(n < 0.12) m[y][x] = T_ICE; else if(n < 0.20) m[y][x] = T_MOUNT;
    }
  }
  /* mountain ranges */
  function ridge(x0,y0,x1,y1,thick){
    var steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0));
    for(var i=0;i<=steps;i++){
      var px0 = Math.round(x0 + (x1-x0)*i/steps), py0 = Math.round(y0 + (y1-y0)*i/steps);
      for(var dy=-thick;dy<=thick;dy++) for(var dx=-thick;dx<=thick;dx++){
        var nx = px0+dx, ny = py0+dy;
        if(nx>0&&ny>0&&nx<WW&&ny<WH&&m[ny][nx]!==T_WATER&&r.next()<0.8) m[ny][nx] = T_MOUNT;
      }
    }
  }
  ridge(46,10,52,30,1); ridge(52,30,64,34,1); ridge(30,64,52,70,1); ridge(84,24,90,50,1);
  /* rivers */
  function river(x0,y0,len,dir){
    var cx = x0, cy = y0;
    for(var i=0;i<len;i++){
      if(cx<1||cy<1||cx>=WW-1||cy>=WH-1) break;
      m[cy][cx] = T_WATER; m[cy][cx+1] = T_WATER;
      if(r.next()<0.5) cy += dir; else cx += (r.next()<0.5?1:-1);
    }
  }
  river(30,20,26,1); river(58,54,20,1);
  world = {w:WW,h:WH,m:m,name:'The Seven Lands'};

  /* regional detail before the roads are cut */
  (function(){
    var dr = new LCG(515151), dx, dy;
    /* marsh in the low south-west */
    for(dy=0;dy<WH;dy++) for(dx=0;dx<WW;dx++){
      if(m[dy][dx] !== T_GRASS && m[dy][dx] !== T_FOREST) continue;
      if(inEllipse(dx,dy,24,64,13,9) && dr.next() < 0.55) m[dy][dx] = T_MARSH;
      else if(inEllipse(dx,dy,54,20,10,7) && dr.next() < 0.42) m[dy][dx] = T_MARSH;
    }
    /* orchards and farmland ring the settled middle */
    for(dy=0;dy<WH;dy++) for(dx=0;dx<WW;dx++){
      if(m[dy][dx] !== T_GRASS) continue;
      if(inEllipse(dx,dy,28,44,12,9)){ if(dr.next() < 0.24) m[dy][dx] = T_FARM; else if(dr.next() < 0.16) m[dy][dx] = T_ORCHARD; }
      else if(inEllipse(dx,dy,48,50,11,8)){ if(dr.next() < 0.20) m[dy][dx] = T_ORCHARD; }
      else if(dr.next() < 0.012) m[dy][dx] = T_RUINS;
    }
    /* oases in the deep sand */
    for(dy=0;dy<WH;dy++) for(dx=0;dx<WW;dx++)
      if(m[dy][dx] === T_SAND && dr.next() < 0.006) m[dy][dx] = T_OASIS;
    /* cliff shelves hugging the ranges, never on their own */
    for(dy=1;dy<WH-1;dy++) for(dx=1;dx<WW-1;dx++){
      if(m[dy][dx] !== T_GRASS && m[dy][dx] !== T_HILL && m[dy][dx] !== T_SNOW) continue;
      var nearRock = (m[dy-1][dx] === T_MOUNT) || (m[dy+1][dx] === T_MOUNT) ||
                     (m[dy][dx-1] === T_MOUNT) || (m[dy][dx+1] === T_MOUNT);
      if(nearRock && dr.next() < 0.30) m[dy][dx] = T_CLIFF;
    }
    /* jetties where the roads will meet water */
    for(dy=2;dy<WH-2;dy++) for(dx=2;dx<WW-2;dx++){
      if(m[dy][dx] !== T_WATER) continue;
      var landAdj = 0;
      if(m[dy-1][dx] !== T_WATER) landAdj++;
      if(m[dy+1][dx] !== T_WATER) landAdj++;
      if(m[dy][dx-1] !== T_WATER) landAdj++;
      if(m[dy][dx+1] !== T_WATER) landAdj++;
      if(landAdj >= 2 && dr.next() < 0.05) m[dy][dx] = T_DOCK;
    }
  })();

  /* roads and sites */
  var sites = [];
  var tk, dk;
  for(tk in TOWNS) sites.push({x:TOWNS[tk].worldPos.x, y:TOWNS[tk].worldPos.y, tile:T_TOWN, key:tk});
  for(dk in DUNGEONS) sites.push({x:DUNGEONS[dk].worldPos.x, y:DUNGEONS[dk].worldPos.y, tile:T_CAVE, key:dk});
  SPECIAL_SITES.forEach(function(sp){ sites.push({x:sp.x, y:sp.y, tile:T_FIR, key:sp.key}); });
  function site(k){ for(var i=0;i<sites.length;i++) if(sites[i].key === k) return sites[i]; return sites[0]; }
  function paint(x,y){
    if(x<1||y<1||x>=WW-1||y>=WH-1) return;
    var t = m[y][x];
    if(t === T_WATER) m[y][x] = T_BRIDGE; else m[y][x] = T_ROAD;
  }
  function road(a,b){
    var cx = a.x, cy = a.y;
    while(cx !== b.x){ cx += (b.x>cx?1:-1); paint(cx,cy); }
    while(cy !== b.y){ cy += (b.y>cy?1:-1); paint(cx,cy); }
  }
  [['emberfall','greenhollow'],['greenhollow','warrens'],['greenhollow','stonewatch'],
   ['stonewatch','barrow'],['stonewatch','rimehold'],['stonewatch','sunmere'],
   ['sunmere','dunes'],['rimehold','glacier'],['dunes','ashroot'],['glacier','ashroot'],
   ['emberfall','altar'],['emberfall','abyss'],['emberfall','philadelphia'],
   ['philadelphia','blacksun'],['philadelphia','sunmere'],['sunmere','laodicea'],
   ['laodicea','ashroot']
  ].forEach(function(pr){ road(site(pr[0]), site(pr[1])); });
  /* clear a walkable apron around each site so nothing is walled in */
  sites.forEach(function(sp){
    for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
      var nx = sp.x+dx, ny = sp.y+dy;
      if(nx<1||ny<1||nx>=WW-1||ny>=WH-1) continue;
      if(m[ny][nx] === T_MOUNT || m[ny][nx] === T_LAVA) m[ny][nx] = T_ROAD;
      else if(m[ny][nx] === T_WATER) m[ny][nx] = T_BRIDGE;
    }
    m[sp.y][sp.x] = sp.tile;
  });
  world.sites = sites;
}

function worldZone(x,y){
  var t = world.m[y][x];
  if(G.flags && (G.flags.locusts || G.flags.cavalry) && Math.random() < 0.45) return 'abyss';
  if(t === T_MARSH) return 'crypt';
  if(t === T_ORCHARD || t === T_FARM) return 'plains';
  if(t === T_RUINS || t === T_CLIFF) return 'cave';
  if(t === T_OASIS) return 'desert';
  if(G.flags && G.flags.firFreed && !G.flags.firResealed && !G.flags.mantleSlain){
    var fs = SPECIAL_SITES[0];
    if(Math.abs(x - fs.x) < 7 && Math.abs(y - fs.y) < 7) return 'firwood';
  }
  if(t === T_SNOW || t === T_ICE) return 'snow';
  if(t === T_SAND || t === T_DUNE) return 'desert';
  if(t === T_FOREST) return 'forest';
  if(x > 84 && y > 20 && y < 54) return 'volcano';
  return 'plains';
}
function worldTier(x,y){
  var z = worldZone(x,y);
  if(z === 'volcano') return 5;
  if(z === 'snow') return 4;
  if(z === 'desert') return 3;
  if(z === 'forest') return 2;
  if(x > 50) return 2;
  return 1;
}

function npcCanStand(m, w, h, x, y){
  if(x < 1 || y < 1 || x >= w - 1 || y >= h - 1) return false;
  var t = m[y][x];
  if(BLOCKED[t] || NPC_NOSTEP[t]) return false;
  return true;
}
/* find the longest straight run of open tiles through a point - that becomes the beat */
function paceRoute(m, w, h, x, y, vertical, maxLen){
  maxLen = maxLen || 6;
  var a = {x:x, y:y}, b = {x:x, y:y}, i;
  for(i=1;i<=maxLen;i++){
    var nx = vertical ? x : x - i, ny = vertical ? y - i : y;
    if(!npcCanStand(m, w, h, nx, ny)) break;
    a = {x:nx, y:ny};
  }
  for(i=1;i<=maxLen;i++){
    var px2 = vertical ? x : x + i, py2 = vertical ? y + i : y;
    if(!npcCanStand(m, w, h, px2, py2)) break;
    b = {x:px2, y:py2};
  }
  if(a.x === b.x && a.y === b.y) return null;
  return [a, b];
}
function initNpcMotion(n, m, w, h, seed){
  n.home = {x:n.x, y:n.y};
  n.mvx = 0; n.mvy = 0; n.mvt = 0; n.dir = 0; n.step = 0; n.pause = 0;
  n.wait = 20 + (seed % 40);
  if(n.special || n.recruit){ n.mode = 'still'; return; }
  var r = new LCG(seed * 977 + 13);
  var vertical = r.next() < 0.4;
  var route = paceRoute(m, w, h, n.x, n.y, vertical, 3 + r.int(4));
  if(!route) route = paceRoute(m, w, h, n.x, n.y, !vertical, 3 + r.int(4));
  if(route){ n.mode = 'route'; n.route = route; n.ri = 0; }
  else { n.mode = 'wander'; n.radius = 2; }
}
function loadTown(key){
  var t = TOWNS[key], rows = t.rows, h = rows.length, w = rows[0].length;
  var m = [], npcs = [];
  for(var y=0;y<h;y++){
    m[y] = [];
    for(var x=0;x<w;x++){
      var ch = rows[y][x];
      if(ch >= '1' && ch <= '9'){
        m[y][x] = T_GRASS;
        var def = t.npcs[ch];
        if(def){
          var np = {x:x, y:y, dir:0, key:ch};
          for(var dk2 in def) np[dk2] = def[dk2];
          npcs.push(np);
        }
      } else m[y][x] = TOWN_LEGEND[ch] !== undefined ? TOWN_LEGEND[ch] : T_GRASS;
    }
  }
  dressTown(key, m, w, h, npcs, t);
  var seedBase = 0;
  for(var si=0;si<key.length;si++) seedBase += key.charCodeAt(si);
  npcs.forEach(function(n, i){ initNpcMotion(n, m, w, h, seedBase + i * 31); });
  addAmbientFolk(m, w, h, npcs, seedBase, key);
  return {kind:'town', key:key, name:t.name, w:w, h:h, m:m, npcs:npcs, data:t};
}

  statue:T_STATUE, fountain:T_FOUNTAIN, market:T_MARKET, awning:T_AWNING, stonewall:T_STONEWALL,

/* a flood fill proves the town is still walkable after each prop lands */
function townConnected(m, w, h, spawn, musts){
  var seen = {}, q = [[spawn.x, spawn.y]];
  seen[spawn.x + ',' + spawn.y] = 1;
  while(q.length){
    var c = q.pop();
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(var i=0;i<4;i++){
      var nx = c[0] + dirs[i][0], ny = c[1] + dirs[i][1];
      if(nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      if(BLOCKED[m[ny][nx]]) continue;
      var k = nx + ',' + ny;
      if(seen[k]) continue;
      seen[k] = 1; q.push([nx, ny]);
    }
  }
  for(var j=0;j<musts.length;j++) if(!seen[musts[j].x + ',' + musts[j].y]) return false;
  return true;
}
function dressTown(key, m, w, h, npcs, t){
  var style = TOWN_STYLE[key];
  if(!style) return;
  var r = new LCG(key.length * 7717 + key.charCodeAt(0) * 131), x, y;
  /* repave the streets in this town's material */
  if(style.pave !== T_PATH)
    for(y=0;y<h;y++) for(x=0;x<w;x++) if(m[y][x] === T_PATH) m[y][x] = style.pave;
  /* retile the roofs */
  if(style.roof !== T_ROOF)
    for(y=0;y<h;y++) for(x=0;x<w;x++) if(m[y][x] === T_ROOF) m[y][x] = style.roof;
  /* the doorways and services must stay reachable */
  var musts = [], spawn = t.spawn;
  for(y=0;y<h;y++) for(x=0;x<w;x++){
    var tt = m[y][x];
    if(tt === T_DOOR || tt === T_INN || tt === T_SHOP || tt === T_EXIT || tt === T_CRYPT){
      if(y+1 < h && !BLOCKED[m[y+1][x]]) musts.push({x:x, y:y+1});
      else if(y-1 >= 0 && !BLOCKED[m[y-1][x]]) musts.push({x:x, y:y-1});
    }
  }
  npcs.forEach(function(n){ musts.push({x:n.x, y:n.y}); });
  var keepClear = {};
  musts.forEach(function(mm){ keepClear[mm.x + ',' + mm.y] = 1; });
  /* scatter street furniture on plain ground, never on a route that matters */
  var placed = 0, tries = 0;
  while(placed < 12 && tries < 420){
    tries++;
    x = 1 + r.int(w - 2); y = 1 + r.int(h - 2);
    var cur = m[y][x];
    if(cur !== T_GRASS && cur !== T_FLOWER) continue;
    if(keepClear[x + ',' + y]) continue;
    var prop = style.props[r.int(style.props.length)];
    var tile = PROP_TILE[prop];
    if(tile === undefined) continue;
    var prev = m[y][x];
    m[y][x] = tile;
    if(BLOCKED[tile] && !townConnected(m, w, h, spawn, musts)){ m[y][x] = prev; continue; }
    placed++;
  }
}

function addAmbientFolk(m, w, h, npcs, seed, key){
  var r = new LCG(seed * 7919 + 101), added = 0, tries = 0;
  var taken = {};
  npcs.forEach(function(n){ taken[n.x + ',' + n.y] = 1; });
  while(added < 4 && tries < 300){
    tries++;
    var x = 1 + r.int(w - 2), y = 1 + r.int(h - 2);
    if(!npcCanStand(m, w, h, x, y)) continue;
    if(taken[x + ',' + y]) continue;
    var route = paceRoute(m, w, h, x, y, r.next() < 0.4, 3 + r.int(4));
    if(!route) continue;
    taken[x + ',' + y] = 1;
    var n2 = {x:x, y:y, name:'Townsfolk', lines:AMBIENT_LINES[r.int(AMBIENT_LINES.length)],
              key:'a' + added, ambient:true};
    initNpcMotion(n2, m, w, h, seed + 500 + added * 17);
    n2.mode = 'route'; n2.route = route; n2.ri = 0;
    npcs.push(n2);
    added++;
  }
}

function genDungeon(key, floor){
  var d = DUNGEONS[key], r = new LCG(d.seed * 1000 + floor * 37 + 7);
  var w = 34, h = 26, m = [], y, x;
  for(y=0;y<h;y++){ m[y]=[]; for(x=0;x<w;x++) m[y][x] = T_WALL; }
  var rooms = [], tries = 0, count = 6 + r.int(4);
  while(rooms.length < count && tries < 200){
    tries++;
    var rw = 4 + r.int(6), rh = 3 + r.int(5);
    var rx = 1 + r.int(w - rw - 2), ry = 1 + r.int(h - rh - 2);
    var ok = true;
    for(var i=0;i<rooms.length;i++){
      var o = rooms[i];
      if(rx < o.x+o.w+1 && rx+rw+1 > o.x && ry < o.y+o.h+1 && ry+rh+1 > o.y){ ok = false; break; }
    }
    if(!ok) continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2)});
    for(y=ry;y<ry+rh;y++) for(x=rx;x<rx+rw;x++) m[y][x] = T_FLOOR;
  }
  for(i=1;i<rooms.length;i++){

function makeHero(id, lv){

    skills:[], status:{}, hp:0, mp:0, buffs:{}, form:0};

function gearOnHit(h){

  var out = null;
  ['wep','arm','acc'].forEach(function(sl){
    var g = h.gear[sl];

  });

}

function gearStat(h, key){

  return t;

function formOf(h){ return (h.def.forms && h.form) ? h.def.forms[h.form] : null; }
function stat(h, key){
  var b = h.def.base[key], g = h.def.grow[key];
  var v = Math.floor(b + g * (h.lv - 1)) + gearStat(h, key);
  var fm = formOf(h);
  if(fm) v = Math.floor(v * (key === 'def' ? 1 + (fm.mul - 1) * 0.4 : fm.mul));
  if(h.buffs && h.buffs[key]) v = Math.floor(v * h.buffs[key].amt);

function maxHP(h){ return Math.floor(h.def.base.hp + h.def.grow.hp * (h.lv-1)) + gearStat(h,'hp'); }

function npcOccupied(x, y, self){
  var list = G.map.npcs;
  for(var i=0;i<list.length;i++){
    var n = list[i];
    if(n === self) continue;
    if(n.x === x && n.y === y) return true;

function npcStepTo(n, nx, ny){
  if(!npcCanStand(G.map.m, G.map.w, G.map.h, nx, ny)) return false;
  if(nx === G.px && ny === G.py) return false;
  if(npcOccupied(nx, ny, n)) return false;
  n.dir = (ny > n.y) ? 0 : (ny < n.y ? 1 : (nx < n.x ? 2 : 3));
  n.mvx = n.x - nx; n.mvy = n.y - ny;
  n.x = nx; n.y = ny; n.mvt = 1;

function updateNpcs(){
  if(!G.map || !G.map.npcs) return;
  var list = G.map.npcs;
  for(var i=0;i<list.length;i++){
    var n = list[i];
    if(n.mvt === undefined) continue;
    if(n.mvt > 0){
      n.mvt -= 0.14;
      if(n.mvt < 0.001){ n.mvt = 0; n.step = (n.step + 1) % 2; }
      continue;
    }
    if(n.pause > 0){ n.pause--; continue; }
    if(n.mode === 'still') continue;
    n.wait--;
    if(n.wait > 0) continue;
    n.wait = 22 + rnd(46);
    if(n.mode === 'route' && n.route){
      var tgt = n.route[n.ri];
      if(n.x === tgt.x && n.y === tgt.y){
        n.ri = (n.ri + 1) % n.route.length;
        tgt = n.route[n.ri];
        n.wait = 30 + rnd(40);
        continue;
      }
      var sx = n.x + (tgt.x > n.x ? 1 : (tgt.x < n.x ? -1 : 0));
      var sy = n.x === tgt.x ? n.y + (tgt.y > n.y ? 1 : (tgt.y < n.y ? -1 : 0)) : n.y;
      if(!npcStepTo(n, sx, sy)){
        /* blocked - turn around rather than shove */
        n.ri = (n.ri + 1) % n.route.length;
        n.wait = 24 + rnd(30);
      }
    } else if(n.mode === 'wander'){
      var d = [[1,0],[-1,0],[0,1],[0,-1]][rnd(4)];
      var wx = n.x + d[0], wy = n.y + d[1];
      if(n.home && (Math.abs(wx - n.home.x) > (n.radius||2) || Math.abs(wy - n.home.y) > (n.radius||2))) continue;
      npcStepTo(n, wx, wy);

  }
}

    if(t === T_TOWN){
      for(var k in TOWNS){ var tw = TOWNS[k];
        if(tw.worldPos.x === G.px && tw.worldPos.y === G.py){ G.worldPos = {x:G.px,y:G.py}; enterTown(k); return; } }
    }
    if(t === T_FIR){ firEvent(); return; }
    if(t === T_CAVE){
      for(var d in DUNGEONS){ var dg = DUNGEONS[d];
        if(dg.worldPos.x === G.px && dg.worldPos.y === G.py){
          G.worldPos = {x:G.px,y:G.py};

          if(dg.needSeals && sealCount() < dg.needSeals){

            return;
          }
          if(dg.needTrumpets && (G.flags.trumpets||0) < dg.needTrumpets){
            say(['Nothing here answers yet.',
                 'Trumpets sounded: ' + (G.flags.trumpets||0) + ' of 7.']);
            return;

    if(t === T_EXIT){ leaveToWorld(); return; }
    if(t === T_INN){ openInn(); return; }
    if(t === T_SHOP){ openShop(); return; }
    if(t === T_CRYPT){ enterCrypt(); return; }
    if(t === T_DOOR){ say(pick(['The door is barred from inside.','A family eats supper. They wave you off.','Empty. Someone left in a hurry.','A cat glares until you leave.'])); return; }
  } else if(G.map.kind === 'dungeon'){

function sealCount(){ var n = 0; for(var k in G.seals) if(G.seals[k]) n++; return n; }

function interact(){
  var dx = G.dir===3?1:(G.dir===2?-1:0), dy = G.dir===0?1:(G.dir===1?-1:0);
  var tx = G.px+dx, ty = G.py+dy;
  var n = npcAt(tx,ty);
  if(n){
    n.pause = 150;
    n.dir = G.dir === 0 ? 1 : (G.dir === 1 ? 0 : (G.dir === 2 ? 3 : 2));
    n.mvt = 0;
    if(n.special){ runNpcScript(n); return; }
    var lines = n.lines.slice();
    if(n.recruit && !hasHero(n.recruit)){
      var rid = n.recruit;
      lines.push(nameOf(rid) + ' joins the party.');
      say(lines, function(){ joinHero(rid); });
    } else say(lines);
    return;
  }
  var t = tileAt(tx,ty);
  if(t === T_CHEST && G.map.chests){
    for(var i=0;i<G.map.chests.length;i++){
      var c = G.map.chests[i];
      if(c.x===tx && c.y===ty){
        if(c.open){ say('Empty.'); return; }
        c.open = true; G.map.m[ty][tx] = T_FLOOR;
        if(!G.flags.opened) G.flags.opened = {};
        G.flags.opened[G.map.key + ':' + G.map.floor + ':' + tx + ',' + ty] = 1;
        addItem(c.item);
        say('Found ' + itemName(c.item) + '.');
        return;
      }
    }
  }
  if(t === T_COFFIN) say(pick(['Sealed, and cold enough to stay that way.',
    'A name worn off the lid by other hands.',
    'You leave the rings where they were put.',
    'Something inside settles when you touch the wood. Only dust.']));
  else if(t === T_SIGN) say(signText());
  else if(t === T_WELL) say('The water is cold and tastes of iron.');
  else if(t === T_INN) openInn();
  else if(t === T_SHOP) openShop();
}
function signText(){
  var m = G.map.key;
  if(m === 'emberfall') return ['EPHESUS. The first lampstand.','North road: Smyrna. The first seal lies past it.'];
  if(m === 'greenhollow') return ['SMYRNA. Poor, and rich.','Ten days of testing, and then the crown.'];
  if(m === 'stonewatch') return ['PERGAMUM. Where the throne is.','Antipas was killed on this street.'];
  if(m === 'sunmere') return ['THYATIRA. Bronze and dye.','Her last works are greater than her first.'];
  if(m === 'philadelphia') return ['PHILADELPHIA. Little power, kept word.','An open door that no one can shut.'];
  if(m === 'laodicea') return ['LAODICEA. Gold, cloth, eye-salve.','The water arrives lukewarm. Nobody drinks it.'];
  return ['SARDIS. A name for being alive.','Wake up, and strengthen what remains.'];
}
function nameOf(id){ var d = heroDef(id); return d ? d.name : id; }
function hasHero(id){
  var i;
  for(i=0;i<G.party.length;i++) if(G.party[i].id===id) return true;
  for(i=0;i<G.reserve.length;i++) if(G.reserve[i].id===id) return true;
  return false;
}
function joinHero(id){
  var lead = G.party[0], lv = Math.max(1, lead ? lead.lv - 1 : 1);
  var h = makeHero(id, lv);
  if(G.party.length < 4) G.party.push(h); else G.reserve.push(h);
}

/* ============================================================
   FOLK TALES - the sealed fir, and the woman in the vault
   ============================================================ */
function firEvent(){
  var f = G.flags;
  if(f.firResealed){
    say(['The fir shakes as though a whirlwind were caught inside it.',
         'The plug holds. Snowdrift keeps the woodcutters away, and',
         'nobody in this country walks near the tree at all.']);
    return;
  }
  if(f.spiritLured){ resealScene(); return; }
  if(f.firFreed){
    say(['The crevice gapes where the stopper used to sit.',
         'Whatever came out of it is not in Pergamum for the weather.']);
    return;
  }
  ask(['Something in the fir calls you by your own name.',
       'Deep in the trunk sits a small plug, sealed with three crosses.',
       'A voice: "Draw it. I will pay in medicine, and in gold."'],
      ['Pry out the stopper', 'Leave the three crosses alone'], function(i){
    if(i === 1){
      say(['You leave the crosses where somebody else cut them.',
           'The voice follows you a long way down the road.']);
      return;
    }
    say(['Your knife works the plug loose.',
         'A black spider crawls down the bark, touches ground,',
         'and stands up a tall haggard man in a scarlet mantle,',
         'squinting out of red eyes.',
         'He breaks a hazel twig on the way to a crag, strikes it,',
         'and the rock splits with a crash and swallows him.',
         'He comes back with two phials, yellow and white,',
         'and shuts the crag behind him with a second blow.',
         '"Now Pergamum," he says. "A magician there owes me a tree."'],
      function(){
        addItem('stopper'); addItem('phial_gold'); addItem('phial_white', 3); addItem('t_hazel');
        G.flags.firFreed = true; G.flags.spiritLoose = true;
      });
  });
}
function resealScene(){
  say(['The spider is already at the crevice, delighted to be watched.',
       'You clap the stopper in, hammer it home with a stone,',
       'and cut three fresh crosses over the wood.',
       'The fir bucks like a mast in a gale. The plug holds.',
       'The man who bound him in Pergamum will never know.'],
    function(){
      G.flags.spiritLured = false; G.flags.spiritLoose = false; G.flags.firResealed = true;
      if(G.inv.stopper) useItemCount('stopper');
      G.gold += 800; addItem('elixir', 2);
      G.party.forEach(function(h){ grantXP(h, 900); });
      say(['The phials are exactly what you asked for.',
           'Whatever you become after this, it started here. (+800 gold)']);
    });
}
function mantleEvent(){
  ask(['The Scarlet Mantle stands in the square. Pergamum is shuttered around it.',
       '"The magician who corked me kept a door on this street."'],
      ['Doubt it can shrink to a spider again', 'Draw steel'], function(i){
    if(i === 1){
      say(['The mantle opens like a wound.'], function(){
        beginBattle([makeEnemy('b_mantle', 0, 1)], true, true, function(){
          G.flags.spiritLoose = false; G.flags.mantleSlain = true;
          addItem('elixir'); G.gold += 1200;
          say(['It comes apart into spiders, and the spiders into nothing.',
               'Pergamum opens its shutters. (+1200 gold)']);
        });
      });
      return;
    }
    if(!G.inv.stopper){
      say(['"Possible?" it says. "Certainly. And then what?"',
           'Without the stopper in your hand, the trick is only a trick.']);
      return;
    }
    say(['"Possible, and a pleasure, for the man who let me out."',
         'It is already walking back toward the fir, pleased with itself.'],
      function(){ G.flags.spiritLured = true; });
  });
}
function sextonEvent(){
  ask(['A sexton has the coffin lid off and the lady\'s hand in his.',
       'Two rings are already past the knuckle. He has not heard you.'],
      ['Take him by the collar', 'Say nothing and watch'], function(i){
    var lines = (i === 0)
      ? ['You haul him back off the coffin by his collar.',
         'While he swears at you, the dead hands clasp themselves slowly together.']
      : ['You let him work. He is nearly done when the dead hands',
         'clasp themselves slowly together in front of him.'];
    lines = lines.concat([
      'She sits up. He goes through the vaults screaming and',
      'leaves his lamp burning on the flagstones.',
      'The lady looks at you. "Alive," she says, "but very cold."']);
    say(lines, function(){
      G.flags.escort = true;
      G.flags.sextonRobbed = (i === 1);
      G.follower = {name:'Richmodis'};
      G.trail = [{x:G.px, y:G.py}, {x:G.px, y:G.py}];
      var m = G.map.npcs;
      for(var k=m.length-1;k>=0;k--) if(m[k].special === 'sexton') m.splice(k,1);
    });
  });
}
function courtyardScene(){
  if(G.flags.sextonRobbed && !G.flags.sextonBeaten){
    say(['Something is on the stair ahead of you, in a sexton\'s coat,',
         'and it has not been a sexton for some hours now.'], function(){
      beginBattle([makeEnemy('b_sexton', 0, 1)], true, true, function(){
        G.flags.sextonBeaten = true;
        say(['What is left of him lies still. She does not look at it.'], courtyardScene);
      });
    });
    return;
  }
  say(['You walk her up into the New Marckt and knock at the Parroquet.',
       'The servant will not believe it. "You dream, or you are drunk."',
       '"I should sooner believe my grey mare had got into the garret."',
       'Trot. Trot. Trot. Trot. Directly over their heads.',
       'The mare has her head out of the attic window, enjoying herself.',
       'The burgomaster carries his wife inside and calls up the whole house.'],
    function(){
      G.flags.escort = false; G.flags.richFree = true; G.follower = null; G.trail = null;
      addItem('t_rings'); addItem('curtain');
      G.gold += 400;
      G.party.forEach(function(h){ grantXP(h, 600); });
      enterTown('rimehold');
      say(['She gives you the rings off her own fingers and the curtain',
           'she worked herself. The mare stays in the garret three days.',
           'Come back after you have slept and they will have got her down.']);
    });
}
function plagueEvent(n){
  if(G.flags.plagueCured || !G.inv.phial_white){
    say(n.lines);
    return;
  }
  ask(['Nils coughs into his sleeve and does not show you what came up.',
       'The grey pest is in the wells. Half of Sardis is down with it.'],
      ['Spend a dose of the White Phial', 'Keep the medicine'], function(i){
    if(i === 1){ say(['He nods. He would have kept it too.']); return; }
    useItemCount('phial_white');
    G.flags.plagueCured = true;
    G.gold += 600;
    G.party.forEach(function(h){ grantXP(h, 500); });
    say(['A white drop in each well in the square.',
         'By evening the coughing has stopped in three houses. By morning, in all of them.',
         'Sardis empties its strongbox into your hands. (+600 gold)']);
  });
}
function angelEvent(n){
  var c = CHURCHES[n.angel];
  if(!c) return;
  if(churchDone(n.angel)){
    say([c.opening, c.promiseLine, 'The lampstand stands. Go on to the next.']);
    return;
  }
  if(!G.flags.patmos){
    say(['The angel does not turn around.',
         '"Not yet. You have not been shown the lampstands."',
         'Something is waiting for you where the voice first spoke.']);
    return;
  }
  ask([c.opening].concat(c.know).concat([c.charge, c.trialLine]),
      ['Face ' + c.trialName, 'Not yet'], function(i){
    if(i === 1){ say(['The angel waits. The letter does not expire.']); return; }
    var key = n.angel;
    beginBattle([makeEnemy(c.trial, 0, 1)], true, true, function(){
      if(!G.flags.churches) G.flags.churches = {};
      G.flags.churches[key] = true;
      addItem(c.promise);
      var lines = [c.promiseLine, 'Received: ' + GEAR[c.promise].name + '.'];
      if(c.extra){ addItem(c.extra); lines.push('Taken from the body: ' + GEAR[c.extra].name + '.'); }
      var n2 = churchCount();
      if(n2 < 7) lines.push('Lampstands standing: ' + n2 + ' of 7.');
      else lines.push('All seven stand. The scroll in the right hand can be opened now.');
      say(lines);
    }, c.survive ? {survive:c.survive} : null);
  });
}
function runNpcScript(n){
  if(n.special === 'angel'){ angelEvent(n); return; }
  if(n.special === 'mantle'){ mantleEvent(); return; }
  if(n.special === 'sexton'){ sextonEvent(); return; }
  if(n.special === 'plague'){ plagueEvent(n); return; }
  if(n.special === 'burgomaster'){
    if(G.flags.richFree){
      say(['"She is upstairs and warm and she will outlive me,"',
           'says Richmuth, "and the mare is a public favourite."']);
      return;
    }
    G.flags.vaultKnown = true;
    say(n.lines.concat(['The chapel door on the right of the square goes down to the vault.',
      'Take a lamp. The sexton keeps the key and keeps odd hours.']));
    return;
  }
  say(n.lines);
}

/* ============================================================
   HAR-MAGEDON, BABYLON, THE DRAGON, THE CITY
   ============================================================ */
function harBattle(id, intro, onWin){
  say(intro, function(){
    beginBattle([makeEnemy(id, 0, 1)], true, true, onWin);
  });
}
function harmagedonChain(){
  G.flags.harStage = 1;
  harBattle('b_seabeast',
    ['A beast comes up out of the sea: ten horns, seven heads, a blasphemous name on each.',
     'Like a leopard, with a bear\'s feet and a lion\'s mouth.',
     'One head carries a mortal wound that healed, and the whole earth follows it wondering.',
     '"Who is like the beast? Who can fight against it?"'],
    function(){
      G.flags.harStage = 2;
      harBattle('b_falseprophet',
        ['A second beast comes up out of the earth. Two horns like a lamb. It speaks like a dragon.',
         'It calls fire down out of heaven in front of everyone, and they believe it.',
         'It marks them on the right hand or the forehead so they can buy and sell.',
         'The number is a human number: six hundred and sixty-six.'],
        function(){
          G.flags.harStage = 3; G.flags.markBroken = true;
          harBattle('b_babylon',
            ['A woman on a scarlet beast, in purple and scarlet, gold and pearls,',
             'a cup in her hand full of abominations, and a name of mystery on her forehead.',
             'She is drunk on the blood of the saints, and she says in her heart:',
             '"A queen I sit. I am no widow. I shall never see mourning."'],
            function(){
              G.flags.babylonFallen = true;
              say(['"Fallen, fallen is Babylon the great."',
                   'An angel throws a stone like a great millstone into the sea:',
                   'so shall the great city be thrown down, and never be found again.',
                   'No harper, no craftsman, no millstone, no lamp, no bridegroom - not any more.',
                   'Behind her, the dragon that gave her the throne is still standing.'],
                function(){
                  G.flags.harStage = 4;
                  harBattle('b_dragon',
                    ['The great red dragon: seven heads, ten horns, seven diadems.',
                     'Its tail drags a third of the stars down with it.',
                     'Michael and his angels are already fighting. There is no room left for it in heaven.',
                     'It comes down to you in great wrath, because it knows its time is short.'],
                    function(){ finalVision(); });
                });
            });
        });
    });
}
function finalVision(){
  G.flags.dragonBound = true;
  say(['An angel comes down with the key of the abyss and a great chain,',
       'seizes the ancient serpent, and shuts and seals him over for a thousand years.',
       'Thrones are set, and those beheaded for the testimony live and reign.',
       'Then a great white throne, and books opened, and another book, which is the book of life.',
       'Death and Hades are thrown into the lake of fire. That is the second death.'],
    function(){
      say(['A new heaven and a new earth. The sea is no more.',
           'The holy city comes down out of heaven, prepared as a bride for her husband.',
           '"Behold, the dwelling of God is with men."',
           'He wipes away every tear. Death is no more, nor mourning, nor crying, nor pain.',
           'Twelve gates, twelve pearls, twelve foundations, and a street of clear gold.',
           'No temple in it - the Lord God is its temple, and the Lamb is its lamp.',
           'No sun needed, no lamp, and no night at all.',
           'The Spirit and the Bride say: Come. Let the thirsty come and take the water freely.',
           '"Surely I am coming soon." Amen. Come, Lord Jesus.',
           'THE END - grace be with all the saints.'],

}

/* ============================================================
   THE SEVENTH SEAL AND THE SEVEN TRUMPETS
   ============================================================ */
function seventhSeal(){
  G.flags.sealsDone = true;
  G.flags.trumpets = 0;
  G.flags.trumpetSteps = 0;
  G.seals.seventh = true;
  say(['The Lamb opens the seventh seal.',
       'There is silence in heaven for about half an hour.',
       'Then seven angels are given seven trumpets, and an eighth',
       'throws fire from the altar down onto the earth.',
       'Walk. They will sound one at a time, wherever you are.']);
}
var TRUMPETS = [
  {n:1, lines:['The first trumpet. Hail and fire mixed with blood fall on the earth.',
    'A third of the trees burn. All the green grass burns.']},
  {n:2, lines:['The second trumpet. Something like a great burning mountain is thrown into the sea.',
    'A third of the sea turns to blood, and a third of the ships go down.']},
  {n:3, lines:['The third trumpet. A star falls, blazing like a torch, onto the rivers.',
    'Its name is Wormwood. The water turns bitter and men die of it.']},
  {n:4, lines:['The fourth trumpet. A third of the sun is struck, and the moon, and the stars.',
    'A third of the day keeps its light back, and a third of the night.']},
  {n:5, lines:['The fifth trumpet. A star with the key of the shaft opens the abyss.',
    'Smoke like a furnace, and locusts out of the smoke with the power of scorpions.',
    'They are told to spare the grass and sting only the unsealed, for five months.']},
  {n:6, lines:['The sixth trumpet. The four angels bound at the great river are released.',
    'Cavalry beyond counting, breastplates of fire and sulphur, lion-headed horses.',
    'A third of mankind is killed by the fire and smoke out of their mouths.']},
  {n:7, lines:['The seventh trumpet. Loud voices in heaven:',
    '"The kingdom of the world has become the kingdom of our Lord and of his Christ."',
    'The temple of God in heaven opens, and the ark of his covenant is seen.',
    'Lightning, thunder, an earthquake, and heavy hail. Har-Magedon is open.']}
];
function applyTrumpet(n){
  var r = new LCG(9000 + n * 13), x, y;
  if(n === 1){
    for(y=0;y<WH;y++) for(x=0;x<WW;x++)
      if((world.m[y][x] === T_FOREST || world.m[y][x] === T_TREE) && r.next() < 0.34) world.m[y][x] = T_BURNT;
  } else if(n === 2){
    TILE[T_WATER] = TILE_ALT.blood;
  } else if(n === 3){
    for(y=0;y<WH;y++) for(x=0;x<WW;x++)
      if(world.m[y][x] === T_WATER && r.next() < 0.22) world.m[y][x] = T_BITTER;
  } else if(n === 4){
    G.flags.darkened = true;
  } else if(n === 5){
    G.flags.locusts = true;
  } else if(n === 6){
    G.flags.cavalry = true;
    TILE[T_BRIDGE] = TILE_ALT.bridgeBurnt;
  } else if(n === 7){
    G.flags.kingdom = true;
  }
}
function soundTrumpet(){
  var n = (G.flags.trumpets || 0) + 1;
  if(n > 7) return;
  G.flags.trumpets = n;
  applyTrumpet(n);
  var t = TRUMPETS[n-1];
  say(t.lines.concat(n < 7 ? [] : ['Go east, past the ash bridge.']));
}

/* ---------- inn + shop ---------- */
function innPrice(key){
  var order = ['emberfall','greenhollow','stonewatch','sunmere','rimehold','philadelphia','laodicea'];
  var i = order.indexOf(key);
  if(i < 0) i = 0;
  return Math.min(80, 20 + i * 10);
}
function openInn(){
  var cost = innPrice(G.map.key);
  if(G.gold < cost){ say('The innkeeper shakes her head. ' + cost + ' gold a night.'); return; }
  G.gold -= cost;
  G.party.concat(G.reserve).forEach(function(h){ h.hp = maxHP(h); h.mp = maxMP(h); h.status = {}; h.buffs = {}; });
  var extra = [];
  if(G.flags.firFreed && (G.inv.phial_white || 0) < 3){ G.inv.phial_white = 3; extra.push('The white phial fills itself again overnight.'); }
  if(G.flags.richFree && !G.flags.mare){
    G.flags.mare = true;
    extra.push('Three days up, and they got the grey mare down by scaffolding,');
    extra.push('safe and sound. Richmuth insists you take her.');
  }
  say(['You sleep. Rain on the roof, then morning.',
       'Party fully restored. (-' + cost + ' gold)'].concat(extra));
}
function openShop(){
  G.shop = {list: G.map.data.shop.slice(), idx:0, mode:'buy', scroll:0};
  G.scene = 'shop';
}

/* ============================================================
   RENDERING - FIELD
   ============================================================ */
function drawField(){
  var camX = G.px * TS + (G.mvx * TS * G.mvt) - W/2 + TS/2;
  var camY = G.py * TS + (G.mvy * TS * G.mvt) - H/2 + TS/2 + 8;
  var mw = G.map.w * TS, mh = G.map.h * TS;
  if(mw > W) camX = clamp(camX, 0, mw - W); else camX = (mw - W)/2;
  if(mh > H-40) camY = clamp(camY, 0, mh - (H)); else camY = (mh - (H-24))/2;
  ctx.fillStyle = '#0d1017'; ctx.fillRect(0,0,W,H);
  var x0 = Math.floor(camX/TS), y0 = Math.floor(camY/TS);
  var x1 = Math.ceil((camX+W)/TS), y1 = Math.ceil((camY+H)/TS);
  for(var y=y0;y<=y1;y++) for(var x=x0;x<=x1;x++){
    if(x<0||y<0||x>=G.map.w||y>=G.map.h) continue;
    var t = G.map.m[y][x], img = TILE[t];
    if(t === T_ROOF || t === T_DOOR || t === T_INN || t === T_SHOP || t === T_TREE ||
       t === T_FENCE || t === T_SIGN || t === T_WELL || t === T_CHEST){
      ctx.drawImage(TILE[G.map.kind==='dungeon'?T_FLOOR:T_GRASS], Math.round(x*TS-camX), Math.round(y*TS-camY));
    }
    if(img) ctx.drawImage(img, Math.round(x*TS-camX), Math.round(y*TS-camY));
  }
  /* npcs */
  G.map.npcs.forEach(function(n){
    var sp = (n.recruit && !hasHero(n.recruit)) ? G.sprites[n.recruit]
             : G.sprites['npc' + ((n.name.charCodeAt(0) + (n.home ? n.home.x : n.x) + (n.home ? n.home.y : n.y)) % NPC_LOOKS.length)];
    var mvt = n.mvt || 0, mvx = n.mvx || 0, mvy = n.mvy || 0;
    var nx = Math.round((n.x + mvx*mvt)*TS - camX);
    var ny = Math.round((n.y + mvy*mvt)*TS - camY - 4);
    var nf = mvt > 0 ? (Math.floor(G.tick/6) % 2) : (n.step || 0);
    var nd = n.dir || 0;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(nx+8, ny+16, 5, 2, 0, 0, 6.3); ctx.fill();
    ctx.drawImage(sp, (nd*2+nf)*16, 0, 16, 16, nx, ny, 16, 16);
  });
  /* player + trailing party */
  var lead = G.party[0];
  var ox = Math.round((G.px + G.mvx*G.mvt)*TS - camX), oy = Math.round((G.py + G.mvy*G.mvt)*TS - camY - 4);
  var fr = G.mvt > 0 ? (Math.floor(G.tick/6) % 2) : (Math.floor(G.tick/30) % 2);
  if(G.follower && G.trail && G.trail.length){
    var tp = G.trail[0];
    var fx0 = Math.round((tp.x + G.mvx*G.mvt)*TS - camX), fy0 = Math.round((tp.y + G.mvy*G.mvt)*TS - camY - 4);
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath();
    ctx.ellipse(fx0+8, fy0+16, 5, 2, 0, 0, 6.3); ctx.fill();
    ctx.drawImage(G.sprites.shroudwoman, (G.dir*2+fr)*16, 0, 16, 16, fx0, fy0, 16, 16);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath();
  ctx.ellipse(ox+8, oy+16, 5, 2, 0, 0, 6.3); ctx.fill();
  var mounted = G.flags.mare && G.map.kind === 'world';
  if(mounted){
    ctx.save();
    if(G.dir === 2){ ctx.translate(ox + 16, oy + 3); ctx.scale(-1, 1); ctx.drawImage(G.sprites.mare, 0, 0); }
    else ctx.drawImage(G.sprites.mare, ox, oy + 3);
    ctx.restore();
    oy -= 6;
  }
  ctx.drawImage(G.sprites[lead ? lead.id : 'gideon'], (G.dir*2+fr)*16, 0, 16, 16, ox, oy, 16, 16);

function clearTextRect(x,y,w,h){
  if(!TX) return;
  TX.clearRect(Math.floor(x*txScale), Math.floor(y*txScale),
               Math.ceil(w*txScale), Math.ceil(h*txScale));
}
function panel(x,y,w,h,alpha){
  clearTextRect(x, y, w, h);
  ctx.fillStyle = 'rgba(8,11,20,' + (alpha===undefined?0.96:alpha) + ')';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = '#93a0b8'; ctx.lineWidth = 1;
  ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
  ctx.strokeStyle = '#2f3a50';
  ctx.strokeRect(x+2.5,y+2.5,w-5,h-5);
}
var TX = null, txScale = 1;
var FONT_STACK = '"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
/* small legacy sizes get scaled up into a comfortable reading range */
function FS(size){
  size = size || 8;
  if(size >= 20) return size * 1.30;
  if(size >= 10) return size * 1.34;
  return Math.max(10.5, size * 1.44);
}
function txFont(size, weight){
  return (weight || 700) + ' ' + (FS(size) * txScale).toFixed(1) + 'px ' + FONT_STACK;
}
function text(s, x, y, col, size, weight){
  if(!TX) return;
  s = String(s);
  TX.font = txFont(size, weight);
  TX.textAlign = 'left'; TX.textBaseline = 'alphabetic';
  TX.lineJoin = 'round'; TX.miterLimit = 2;
  TX.lineWidth = Math.max(2.2, FS(size) * txScale * 0.30);
  TX.strokeStyle = 'rgba(4,6,12,0.95)';
  TX.strokeText(s, x * txScale, y * txScale);
  TX.fillStyle = col || '#f4f6fa';
  TX.fillText(s, x * txScale, y * txScale);
}
function textW(s, size, weight){
  if(!TX) return String(s).length * FS(size) * 0.54;
  TX.font = txFont(size, weight);
  return TX.measureText(String(s)).width / txScale;
}
function ctext(s, cx, y, col, size, weight){
  text(s, Math.round(cx - textW(s, size, weight) / 2), y, col, size, weight);
}
function fitText(s, maxW, size){
  s = String(s);
  if(textW(s, size) <= maxW) return s;
  while(s.length > 1 && textW(s + '...', size) > maxW) s = s.slice(0, -1);
  return s + '...';
}
function wrapText(str, maxW, size){
  var words = String(str).split(' '), out = [], line = '';
  for(var i=0;i<words.length;i++){
    var probe = line ? line + ' ' + words[i] : words[i];
    if(textW(probe, size) <= maxW || !line){ line = probe; }
    else { out.push(line); line = words[i]; }
  }
  if(line) out.push(line);
  return out.length ? out : [''];
}
function wrapAll(lines, maxW, size){
  var out = [];
  for(var i=0;i<lines.length;i++){
    if(lines[i] === '') { out.push(''); continue; }
    out = out.concat(wrapText(lines[i], maxW, size));
  }
  return out;
}
function bar(x,y,w,h,pct,col,bg){
  pct = clamp(pct,0,1);
  ctx.fillStyle = bg || '#22252e'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = col; ctx.fillRect(x,y,Math.round(w*pct),h);
  ctx.strokeStyle = '#0a0d14'; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function cursor(x,y){
  ctx.fillStyle = '#f0d05a';
  ctx.beginPath(); ctx.moveTo(x,y-3); ctx.lineTo(x+5,y); ctx.lineTo(x,y+3); ctx.fill();
}

   ============================================================ */
function makeEnemy(id, slot, boost){
  var d = BESTIARY[id];
  var mul = boost || 1;
  return {isE:true, id:id, def:d, name:d.name, art:G.enemyArt[id],
    hp: Math.floor(d.hp*mul), maxhp: Math.floor(d.hp*mul),
    atkv:Math.floor(d.atk*mul), defv:Math.floor(d.def*mul), magv:Math.floor(d.mag*mul), spdv:d.spd,
    status:{}, buffs:{}, slot:slot, shake:0, flash:0, dead:false};
}
function enemyPool(zone, tier){
  var pool = ZONES[zone] || ZONES.plains;
  return pool;
}
function startRandomBattle(){
  var zone, tier;
  if(G.map.kind === 'world'){ zone = worldZone(G.px,G.py); tier = worldTier(G.px,G.py); }
  else { zone = G.map.data.zone; tier = G.map.data.tier; }
  var pool = enemyPool(zone, tier).slice(0, Math.min(12, 5 + tier * 2));
  var n = tier <= 1 ? 1 + rnd(2) : (tier <= 3 ? 1 + rnd(3) : 2 + rnd(2));
  if(G.party.length === 1) n = Math.min(n, 2);
  var list = [];
  for(var i=0;i<n;i++) list.push(makeEnemy(pick(pool), i, 1 + (G.map.kind==='dungeon' ? 0.1*(G.map.floor-1) : 0)));
  beginBattle(list, false);
}
function startBossFight(){
  var d = G.map.data;
  if(G.flags['boss_' + G.map.key]){ say('The chamber is quiet now.'); return; }
  var b = makeEnemy(d.boss, 0, 1);
  beginBattle([b], true);
}
function beginBattle(enemies, isBoss, mid, onWin, opts){
  /* name duplicates A/B/C */
  var counts = {};
  enemies.forEach(function(e){ counts[e.id] = (counts[e.id]||0)+1; });
  var seen = {};
  enemies.forEach(function(e){
    if(counts[e.id] > 1){ seen[e.id] = (seen[e.id]||0)+1; e.name = e.def.name + ' ' + 'ABC'[seen[e.id]-1]; }
  });
  G.battle = {
    enemies: enemies, boss: isBoss, mid: !!mid, onWin: onWin || null,
    survive: (opts && opts.survive) || 0, round: 0, order: [], oi: 0, phase:'intro', timer: 40, fx: [],
    msg: (isBoss ? enemies[0].name + ' blocks the way!' : 'Ambush!'), pops:[], sel:0, sub:0, subList:null,
    target:0, targetSide:'enemy', actor:null, flee:false, escaped:false, anim:0, result:null, scroll:0
  };
  G.party.forEach(function(h){ h.buffs = {}; h.shake = 0; h.flash = 0; if(!h.status) h.status = {}; });
  applyGearPassives();
  G.scene = 'battle';
}
function battleOrder(){
  var all = G.party.filter(alive).concat(G.battle.enemies.filter(function(e){ return e.hp>0; }));
  all.sort(function(a,b){ return spdOf(b) - spdOf(a); });
  return all;
}
function spdOf(c){
  var v = c.isE ? c.spdv : stat(c,'spd');
  if(c.buffs && c.buffs.spd) v = Math.floor(v * c.buffs.spd.amt);
  if(c.status && (c.status.slow || c.status.chill)) v = Math.floor(v*0.6);
  return v + rnd(3);
}
function atkOf(c){
  var v = c.isE ? c.atkv : stat(c,'atk');
  if(c.buffs && c.buffs.atk) v = Math.floor(v*c.buffs.atk.amt);
  if(c.status && c.status.fear) v = Math.floor(v*0.7);
  return v;
}
function defOf(c){ var v = c.isE ? c.defv : stat(c,'def'); if(c.buffs&&c.buffs.def) v = Math.floor(v*c.buffs.def.amt); if(c.guard) v = Math.floor(v*1.9); return v; }
function magOf(c){ var v = c.isE ? c.magv : stat(c,'mag'); if(c.buffs&&c.buffs.mag) v = Math.floor(v*c.buffs.mag.amt); return v; }
function hpOf(c){ return c.isE ? c.maxhp : maxHP(c); }
function nameOfC(c){ return c.isE ? c.name : c.def.name; }

function elMod(target, el){
  if(!el || el === 'none') return 1;
  var d = target.isE ? target.def : null;
  if(d){
    if(d.weak && d.weak.indexOf(el) >= 0) return 1.65;
    if(d.resist && d.resist.indexOf(el) >= 0) return 0.45;
  }
  return 1;
}
function pop(target, txt, col){
  G.battle.pops.push({t:txt, c:col||'#ffffff', life:46, ref:target, dy:0});
}
function damage(src, tgt, opts){
  opts = opts || {};
  var base;
  if(opts.type === 'magic'){
    base = magOf(src) * (opts.pow||1) * 1.5 - defOf(tgt)*0.25 - magOf(tgt)*0.35;
  } else {
    var dv = defOf(tgt) * (1 - (opts.ignoreDef||0));
    base = atkOf(src) * (opts.pow||1) * 1.65 - dv * 0.95;
  }
  base *= elMod(tgt, opts.el);
  if(tgt.isE && tgt.def.resist && tgt.def.resist.indexOf('phys')>=0 && opts.type!=='magic') base *= 0.5;
  var crit = Math.random() < 0.07;
  if(crit) base *= 1.8;
  base *= 0.9 + Math.random()*0.2;
  var dmg = Math.max(1, Math.round(base));
  var oh = gearOnHit(src);
  if(oh && Math.random() < oh.chance){
    if(!tgt.status) tgt.status = {};
    tgt.status[oh.status] = Math.max(tgt.status[oh.status] || 0, oh.turns || 3);
    pop(tgt, (STATUS_INFO[oh.status] ? STATUS_INFO[oh.status].tag : oh.status),
        STATUS_INFO[oh.status] ? STATUS_INFO[oh.status].col : '#ffffff');
  }
  tgt.hp -= dmg;
  tgt.shake = 12; tgt.flash = 10;
  pop(tgt, (crit ? '!' : '') + dmg, crit ? '#ffd35e' : (opts.type==='magic' ? '#a9d6ff' : '#ffffff'));
  if(tgt.hp <= 0){ tgt.hp = 0; if(tgt.isE) tgt.dead = true; }
  return dmg;
}
function healTarget(t, amt){
  var m = hpOf(t);
  t.hp = Math.min(m, t.hp + amt);
  pop(t, '+' + amt, '#7ce88a');
}
var STATUS_INFO = {
  poison:{tag:'PSN', col:'#c98ae8'}, burn:{tag:'BRN', col:'#ff9a4a'},
  chill:{tag:'CHL', col:'#8ad6ff'}, fear:{tag:'FER', col:'#c8a0d6'},
  regen:{tag:'RGN', col:'#7ce88a'}
};
function statusTick(c, out){
  if(c.status && c.status.poison){
    var d = Math.max(1, Math.floor(hpOf(c) * 0.07));
    c.hp = Math.max(0, c.hp - d);
    pop(c, d, '#b06ad6');
    out.push(nameOfC(c) + ' takes poison damage.');
    if(c.hp === 0 && c.isE) c.dead = true;
  }
  if(c.status && c.status.burn){
    var bd = Math.max(1, Math.floor(hpOf(c) * 0.09));
    c.hp = Math.max(0, c.hp - bd);
    pop(c, bd, '#ff9a4a');
    fxAt(c, 'firewall', 'fire', {life:22});
    out.push(nameOfC(c) + ' is burning.');
    if(c.hp === 0 && c.isE) c.dead = true;
  }
  if(c.status && c.status.regen && c.hp > 0){
    var rg = Math.max(1, Math.floor(hpOf(c) * 0.08));
    c.hp = Math.min(hpOf(c), c.hp + rg);
    pop(c, '+' + rg, '#7ce88a');
  }
  ['atk','def','spd','mag'].forEach(function(k){
    if(c.buffs && c.buffs[k]){ c.buffs[k].turns--; if(c.buffs[k].turns <= 0) delete c.buffs[k]; }
  });
  if(c.status) for(var st in c.status){ c.status[st]--; if(c.status[st] <= 0) delete c.status[st]; }
}

function fxElementFor(src, fallback){
  var fm = (!src.isE) ? formOf(src) : null;
  if(fm && fm.pal && fm.pal !== 'none') return fm.pal;
  return fallback || 'none';
}
var PROJ_FX = {beam:1, fang:1, boomerang:1, comet:1, fireball:1, muzzle:1};
function castFx(src, s, targets, fel){
  if(!s.fx) return;
  if(s.fx === 'beam'){ fxBeam(src, targets[0], fel, 52); return; }
  targets.forEach(function(t){
    if(PROJ_FX[s.fx]){ fxThrow(src, t, s.fx, fel); return; }
    fxAt(t, s.fx, fel, {life: (s.fx === 'sunstrike' || s.fx === 'firewall' || s.fx === 'meteor') ? 46 : 34});
  });
}
function fxThrow(src, tgt, type, el){
  var sx = (src && src.ux !== undefined) ? src.ux : 240, sy = (src && src.uy !== undefined) ? src.uy + 20 : 96;
  var tx = (tgt && tgt.ux !== undefined) ? tgt.ux : 90, ty = (tgt && tgt.uy !== undefined) ? tgt.uy + 20 : 90;
  spawnFx(type, {x:sx, y:sy, x2:tx, y2:ty, el:el, life: type === 'boomerang' ? 44 : 36});
}
var ENEMY_ATK_FX = {
  dragon:['slash','fang'], beast:['slash','fang'], golem:['shock','meteor'],
  wisp:['burst','spiral'], blob:['burst','ring'], insect:['strike','fang'],
  plant:['strike','spiral'], undead:['slash','blackhole'], flyer:['slash','tornado'],
  biped:['slash','punch'], serpent:['fang','strike'], eye:['spiral','burst'],
  jelly:['ring','burst'], crab:['punch','shock'], bird:['tornado','slash'],
  mimic:['punch','strike'], demon:['comet','slash'], horror:['blackhole','spiral']
};
function enemyAttackFx(e){
  var list = ENEMY_ATK_FX[e.def.art] || ['strike'];

function startRound(){

function nextActor(){

    b.actor = c;
    if(c.isE){ b.msgs = out.concat(enemyTurn(c)); b.phase = 'exec'; b.timer = 42; if(checkEnd()) {} return; }
    if(c.form && c.def.forms){
      var fmU = c.def.forms[c.form];

function advanceTurn(){ var b = G.battle; b.oi++; nextActor(); }
function commit(msgs){
  var b = G.battle; b.msgs = msgs || []; b.phase = 'exec';

function battleCmds(a){

function transform(a, idx){

    a.form = 0;

    else if(cmd === 'Item'){ b.subList = fieldItemList(true); b.sub = 0; b.phase = 'item'; }

      text(fm2.name, 64, yy3, b.sub === i ? '#ffd95e' : (can ? (fidx ? lit : '#cfd6e2') : '#6f7a8c'), 8);

  if(b.phase === 'skill' || b.phase === 'item'){

      var yy2 = 54 + (i-start)*16, key = list[i];

        var s = SKILLS[key]; label = s.name; right = s.mp + ' MP'; ok = b.actor.mp >= s.mp;

      text(fitText(label, 140, 8), 64, yy2, ok ? (b.sub===i?'#ffd95e':'#cfd6e2') : '#6f7a8c', 8);
      text(right, 220, yy2, ok ? '#a9b4c6' : '#616b7c', 7);
      if(b.sub === i) cursor(54, yy2 - 4);
    }
    if(!list.length) ctext('Nothing here.', 160, 84, '#a9b4c6', 8);
    var d = b.phase === 'skill' ? (SKILLS[list[b.sub]]||{}).desc : (ITEMS[list[b.sub]]||{}).desc;
    if(d){
      var dl = wrapText(d, 216, 7);
      for(var di=0; di<Math.min(2, dl.length); di++) ctext(dl[di], 160, 136 + di*12, '#a9b4c6', 7);
    }
  }
  if(b.phase === 'target'){
    var t = b.targetSide === 'enemy' ? b.enemies[b.target] : G.party[b.target];
    if(t) text('Target: ' + nameOfC(t), 114, H-52, '#ffd95e', 8);
  }
}

/* ============================================================
   FIELD MENU
   ============================================================ */
function openMenu(){
  G.menu = {stack:[{page:'main', sel:0, scroll:0}]};
  G.scene = 'menu';
}
function mtop(){ return G.menu ? G.menu.stack[G.menu.stack.length-1] : null; }
function mpush(p){ if(!G.menu) return; G.menu.stack.push({page:p.page, sel:0, scroll:0, data:p.data||null}); }
function mpop(){ if(!G.menu) return; G.menu.stack.pop(); if(!G.menu.stack.length){ G.menu = null; G.scene = 'field'; } }

function menuList(){
  var t = mtop();
  if(!t) return [];
  if(t.page === 'main') return ['Items','Equip','Party','Status','Journal','Save','Close'];
  if(t.page === 'items') return fieldItemList(false);
  if(t.page === 'itemtgt' || t.page === 'equiphero' || t.page === 'statushero' || t.page === 'partyswap')
    return G.party.map(function(h){ return h.def.name; });
  if(t.page === 'equipslot') return ['Weapon','Armor','Trinket','Unequip all'];
  if(t.page === 'equippick') return t.data.list;
  if(t.page === 'partypick') return G.reserve.map(function(h){ return h.def.name; }).concat(['Cancel']);
  if(t.page === 'save') return ['Slot 1','Slot 2','Slot 3'];
  if(t.page === 'status' || t.page === 'journal') return [];
  return [];
}
function gearFor(h, slot){
  var out = [];
  for(var k in G.inv){
    var g = GEAR[k];
    if(!g || g.slot !== slot) continue;
    if(g.who && g.who.indexOf(h.id) < 0) continue;
    out.push(k);
  }
  return out;
}
function menuConfirm(){
  var t = mtop(); if(!t) return;
  var list = menuList();
  if(t.page === 'main'){
    if(t.sel === 0) mpush({page:'items'});
    else if(t.sel === 1) mpush({page:'equiphero'});
    else if(t.sel === 2) mpush({page:'partyswap'});
    else if(t.sel === 3) mpush({page:'statushero'});
    else if(t.sel === 4) mpush({page:'journal'});
    else if(t.sel === 5) mpush({page:'save'});
    else { G.menu = null; G.scene = 'field'; }
    return;
  }
  if(t.page === 'items'){
    if(!list.length) return;
    var id = list[t.sel], it = ITEMS[id];
    if(it.kind === 'partyfull'){
      G.party.concat(G.reserve).forEach(function(h){ if(h.hp > 0){ h.hp = maxHP(h); h.mp = maxMP(h); h.status = {}; } });
      useItemCount(id); G.menu = null;
      say('A drop each. Every fever in the party breaks at once.');
      return;
    }
    if(it.kind === 'camp'){
      G.party.concat(G.reserve).forEach(function(h){ h.hp = maxHP(h); h.mp = maxMP(h); h.status={}; });
      useItemCount(id); G.menu = null; say('The party camps. Everyone recovers.');
      return;
    }
    mpush({page:'itemtgt', data:{id:id}});
    return;
  }
  if(t.page === 'itemtgt'){
    var h = G.party[t.sel], id2 = t.data ? t.data.id : G.menu.stack[G.menu.stack.length-2].data.id;
    var it2 = ITEMS[id2];
    if(it2.kind === 'heal' && h.hp > 0) h.hp = Math.min(maxHP(h), h.hp + it2.amt);
    else if(it2.kind === 'mp') h.mp = Math.min(maxMP(h), h.mp + it2.amt);
    else if(it2.kind === 'cure') h.status = {};
    else if(it2.kind === 'revive'){ if(h.hp <= 0) h.hp = Math.floor(maxHP(h)*0.5); else return; }
    else if(it2.kind === 'full'){ h.hp = maxHP(h); h.mp = maxMP(h); h.status = {}; }
    else return;
    useItemCount(id2);
    mpop();
    return;
  }
  if(t.page === 'equiphero'){ mpush({page:'equipslot', data:{hero:t.sel}}); return; }
  if(t.page === 'equipslot'){
    var hero = G.party[t.data.hero];
    if(t.sel === 3){
      ['wep','arm','acc'].forEach(function(sl){ if(hero.gear[sl]){ addItem(hero.gear[sl]); hero.gear[sl] = null; } });
      hero.hp = Math.min(hero.hp, maxHP(hero));
      return;
    }
    var slot = ['wep','arm','acc'][t.sel];
    mpush({page:'equippick', data:{hero:t.data.hero, slot:slot, list:gearFor(hero, slot)}});
    return;
  }
  if(t.page === 'equippick'){
    var hh = G.party[t.data.hero], key = t.data.list[t.sel];
    if(!key) return;
    var prev = hh.gear[t.data.slot];
    hh.gear[t.data.slot] = key;
    useItemCount(key);
    if(prev) addItem(prev);
    hh.hp = Math.min(hh.hp, maxHP(hh));
    mpop();
    return;
  }
  if(t.page === 'partyswap'){
    if(!G.reserve.length){ return; }
    mpush({page:'partypick', data:{slot:t.sel}});
    return;
  }
  if(t.page === 'partypick'){
    if(t.sel >= G.reserve.length){ mpop(); return; }
    var slotIdx = t.data.slot, a = G.party[slotIdx], bb = G.reserve[t.sel];
    G.party[slotIdx] = bb; G.reserve[t.sel] = a;
    mpop();
    return;
  }
  if(t.page === 'save'){
    var slot = t.sel + 1, existed = !!slotInfo(slot);
    saveSlot(slot);
    G.menu = null;
    say((existed ? 'Overwrote slot ' : 'Saved to slot ') + slot + '.' +
        (STORE.persistent ? '' : ' (This preview cannot keep saves after closing - deploy the file to keep them.)'));
    return;
  }
  if(t.page === 'statushero'){ mpush({page:'status', data:{hero:t.sel}}); return; }
  if(t.page === 'status' || t.page === 'journal'){ mpop(); return; }
}
function menuMove(dy){
  var t = mtop(); if(!t) return;

  if(t.page === 'equippick') n = t.data.list.length;

function shopList(){
  var s = G.shop;
  if(s.mode === 'buy') return s.list;
  var out = [];
  for(var k in G.inv){
    if(ITEMS[k] && (ITEMS[k].noSell || ITEMS[k].kind === 'key')) continue;
    if(ITEMS[k] || GEAR[k]) out.push(k);
  }
  return out;
}
function priceOf(id){ return ITEMS[id] ? ITEMS[id].price : (GEAR[id] ? GEAR[id].price : 10); }
function shopConfirm(){
  var s = G.shop, list = shopList(), id = list[s.idx];
  if(!id) return;
  if(s.mode === 'buy'){
    var p = priceOf(id);
    if(G.gold < p){ s.flash = 'Not enough gold.'; s.flashT = 60; return; }
    G.gold -= p; addItem(id); s.flash = 'Bought ' + itemName(id) + '.'; s.flashT = 50;
  } else {
    var v = Math.floor(priceOf(id) * 0.5);
    G.gold += v; useItemCount(id);
    s.flash = 'Sold for ' + v + 'g.'; s.flashT = 50;
    if(s.idx >= shopList().length) s.idx = Math.max(0, shopList().length - 1);
  }
}
function drawShop(){
  drawField();
  ctx.fillStyle = 'rgba(6,9,16,0.82)'; ctx.fillRect(0,0,W,H);
  clearTextRect(0,0,W,H);
