      ctx.fillStyle = i % 2 ? pal[0] : pal[1];
      ctx.beginPath();
      ctx.moveTo(px2, py2 - tw); ctx.lineTo(px2 + tw * 0.35, py2); ctx.lineTo(px2, py2 + tw);
      ctx.lineTo(px2 - tw * 0.35, py2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(px2 - tw, py2); ctx.lineTo(px2, py2 - tw * 0.35); ctx.lineTo(px2 + tw, py2);
      ctx.lineTo(px2, py2 + tw * 0.35); ctx.fill();
    }
    break;

  case 'heal':
    ctx.globalAlpha = 1 - p;
    var jh = jag(f.seed, 16);
    for(i=0;i<7;i++){
      var hx = x + jh[i] * 16, hy = y + 14 - p * 34 - i * 3;
      ctx.fillStyle = i % 2 ? pal[0] : pal[1];
      ctx.fillRect(hx - 1, hy - 4, 2, 8); ctx.fillRect(hx - 4, hy - 1, 8, 2);
    }
    ctx.strokeStyle = pal[1]; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, y + 14, 20, 6, 0, 0, 6.3); ctx.stroke();
    break;

  case 'fang':{
    /* spectral beast head lunging at the target */
    var fp3 = Math.min(1, p * 1.5);
    var fx3 = f.x + (f.x2 - f.x) * fp3, fy3 = f.y + (f.y2 - f.y) * fp3;
    var dxx = f.x2 - f.x, dir2 = dxx < 0 ? -1 : 1;
    ctx.globalAlpha = clamp(1.4 - p * 1.4, 0, 1) * 0.92;
    ctx.translate(fx3, fy3); ctx.scale(dir2, 1);
    for(var ii=0;ii<3;ii++){
      ctx.globalAlpha *= 0.75;
      var trail = ii * 7;
      ctx.fillStyle = ii === 0 ? pal[1] : pal[2];
      /* muzzle */
      ctx.beginPath(); ctx.moveTo(10 + trail * -1, 0);
      ctx.lineTo(-6 - trail, -9); ctx.lineTo(-13 - trail, -4);
      ctx.lineTo(-9 - trail, 0); ctx.lineTo(-13 - trail, 4);
      ctx.lineTo(-6 - trail, 9); ctx.fill();
    }
    ctx.globalAlpha = clamp(1.4 - p * 1.4, 0, 1);
    /* ears + eye + fangs */
    ctx.fillStyle = pal[0];
    ctx.beginPath(); ctx.moveTo(-4, -8); ctx.lineTo(-1, -14); ctx.lineTo(1, -8); ctx.fill();
    ctx.fillStyle = pal[0]; ctx.fillRect(1, -4, 3, 2);
    ctx.beginPath(); ctx.moveTo(4, 2); ctx.lineTo(6, 7); ctx.lineTo(8, 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9, 1); ctx.lineTo(10, 5); ctx.lineTo(11, 0); ctx.fill();
    break; }

  case 'boomerang':{
    /* out and back along an arc */
    var bp2 = p < 0.5 ? p * 2 : (1 - p) * 2;
    var bx2 = f.x + (f.x2 - f.x) * bp2, by2 = f.y + (f.y2 - f.y) * bp2 - Math.sin(p * 3.14) * 18;
    ctx.globalAlpha = 0.95;
    ctx.translate(bx2, by2); ctx.rotate(f.t * 0.55);
    for(var ib=0;ib<2;ib++){
      ctx.fillStyle = ib ? pal[0] : pal[1];
      var w3 = 9 - ib * 3;
      ctx.beginPath(); ctx.moveTo(-w3, -2); ctx.quadraticCurveTo(0, -w3, w3, -2);
      ctx.lineTo(w3 - 3, 2); ctx.quadraticCurveTo(0, -w3 + 4, -w3 + 3, 2); ctx.fill();
    }
    break; }

  case 'comet':{
    var cp2 = Math.min(1, p / 0.7);
    var cx2 = f.x + (f.x2 - f.x) * cp2, cy2 = f.y + (f.y2 - f.y) * cp2;
    if(p < 0.72){
      var ang2 = Math.atan2(f.y2 - f.y, f.x2 - f.x);
      ctx.translate(cx2, cy2); ctx.rotate(ang2);
      for(var ic=0;ic<4;ic++){
        ctx.globalAlpha = 0.9 - ic * 0.2;
        ctx.fillStyle = ic < 1 ? pal[0] : (ic < 3 ? pal[1] : pal[2]);
        ctx.beginPath();
        ctx.moveTo(6 - ic * 2, 0);
        ctx.quadraticCurveTo(-2 - ic * 5, -5 + ic, -16 - ic * 8, 0);
        ctx.quadraticCurveTo(-2 - ic * 5, 5 - ic, 6 - ic * 2, 0); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.fillStyle = pal[0];
      ctx.beginPath(); ctx.arc(4, 0, 4.4, 0, 6.3); ctx.fill();
      /* smoke rings peeling off */
      ctx.strokeStyle = pal[2]; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.ellipse(-6 - (f.t % 8), 0, 2.5, 6, 0, 0, 6.3); ctx.stroke();
    } else {
      var ep3 = (p - 0.72) / 0.28;
      ctx.globalAlpha = 1 - ep3;
      var er2 = 5 + ep3 * 22;
      ctx.fillStyle = pal[1]; ctx.beginPath(); ctx.arc(f.x2, f.y2, er2, 0, 6.3); ctx.fill();
      ctx.fillStyle = pal[0]; ctx.beginPath(); ctx.arc(f.x2, f.y2, er2 * 0.5, 0, 6.3); ctx.fill();
    }
    break; }

  case 'spiral':{
    ctx.globalAlpha = 1 - p * p;
    ctx.translate(x, y);
    for(var isp=0;isp<3;isp++){
      var rot = f.t * 0.24 + isp * 2.09;
      ctx.rotate(2.09);
      ctx.strokeStyle = isp ? pal[1] : pal[0]; ctx.lineWidth = 2.4 - isp * 0.5;
      ctx.beginPath();
      for(var st=0;st<14;st++){
        var aa = rot + st * 0.3, rr3 = 2 + st * (1.1 + p * 1.6);
        var px3 = Math.cos(aa) * rr3, py3 = Math.sin(aa) * rr3 * 0.8;
        if(st === 0) ctx.moveTo(px3, py3); else ctx.lineTo(px3, py3);
      }
      ctx.stroke();
    }
    break; }

  case 'ring':{
    var rp = Math.sin(Math.min(1, p * 1.1) * 3.14);
    ctx.globalAlpha = rp;
    for(var ir=0;ir<3;ir++){
      var rr4 = (8 + ir * 8) + p * 22;
      ctx.strokeStyle = ir === 1 ? pal[0] : pal[1];
      ctx.lineWidth = 2.6 - ir * 0.7;
      ctx.beginPath(); ctx.ellipse(x, y, rr4, rr4 * 0.62, 0, 0, 6.3); ctx.stroke();
    }
    for(var ig=0;ig<8;ig++){
      var ag = ig * 0.785 + f.t * 0.09;
      ctx.fillStyle = pal[0];
      var rg = 8 + p * 22;
      ctx.fillRect(x + Math.cos(ag) * rg - 1, y + Math.sin(ag) * rg * 0.62 - 1, 2, 2);
    }
    break; }

  case 'tornado':{
    ctx.globalAlpha = Math.sin(Math.min(1, p * 1.2) * 3.14) * 0.95;
    var levels = 6;
    for(var it2=0;it2<levels;it2++){
      var ty2 = y + 12 - it2 * 7;
      var tw2 = 4 + it2 * 4 + Math.sin(f.t * 0.5 + it2) * 2;
      var toff = Math.sin(f.t * 0.4 + it2 * 1.4) * 3;
      ctx.strokeStyle = it2 % 2 ? pal[1] : pal[0]; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.ellipse(x + toff, ty2, tw2, 3.2, 0, 0, 6.3); ctx.stroke();
    }
    for(var id2=0;id2<4;id2++){
      var da = f.t * 0.5 + id2 * 1.57;
      ctx.fillStyle = pal[2];
      ctx.fillRect(x + Math.cos(da) * (10 + id2 * 3) - 1.5, y - id2 * 8 + Math.sin(da) * 2, 3, 3);
    }
    break; }

  case 'shardvolley':{
    /* crystalline darts raining in from above-left */
    ctx.globalAlpha = 1 - Math.max(0, p - 0.7) * 3.3;
    var jsv = jag(f.seed, 12);
    for(var iv=0;iv<6;iv++){
      var vp = clamp(p * 1.6 - iv * 0.09, 0, 1);
      var sx3 = x - 26 + iv * 10 + jsv[iv] * 4;
      var sy3 = (y - 40) + vp * (46 + jsv[iv + 6] * 6);
      ctx.save();
      ctx.translate(sx3, sy3); ctx.rotate(0.5);
      ctx.fillStyle = pal[1];
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(3, 0); ctx.lineTo(0, 7); ctx.lineTo(-3, 0); ctx.fill();
      ctx.fillStyle = pal[0];
      ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(1.4, 0); ctx.lineTo(0, 5); ctx.lineTo(-1.4, 0); ctx.fill();
      ctx.restore();
      if(vp >= 1){
        ctx.strokeStyle = pal[0]; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(sx3, y + 6, 4, 3.4, 6.0); ctx.stroke();
      }
    }
    break; }

  case 'meteor':{
    var mp2 = Math.min(1, p / 0.55);
    if(p < 0.58){
      var mx = x + 40 - mp2 * 40, my = y - 52 + mp2 * 52;
      ctx.translate(mx, my); ctx.rotate(2.3);
      for(var im=0;im<3;im++){
        ctx.globalAlpha = 0.9 - im * 0.25;
        ctx.fillStyle = im === 0 ? pal[0] : pal[1];
        ctx.beginPath();
        ctx.moveTo(7 - im * 2, 0);
        ctx.quadraticCurveTo(-4, -6 + im, -20 - im * 7, 0);
        ctx.quadraticCurveTo(-4, 6 - im, 7 - im * 2, 0); ctx.fill();
      }
      ctx.fillStyle = pal[2]; ctx.beginPath(); ctx.arc(3, 0, 5, 0, 6.3); ctx.fill();
      ctx.fillStyle = pal[1]; ctx.beginPath(); ctx.arc(4, -1, 2.6, 0, 6.3); ctx.fill();
    } else {
      var me = (p - 0.58) / 0.42;
      ctx.globalAlpha = 1 - me;
      var jm = jag(f.seed, 14);
      for(var ie=0;ie<7;ie++){
        var rr5 = (6 + me * 26) * (1 - ie * 0.06);
        ctx.fillStyle = ie % 3 === 0 ? pal[0] : (ie % 3 === 1 ? pal[1] : pal[2]);
        ctx.beginPath();
        ctx.arc(x + jm[ie] * rr5 * 0.8, y + jm[ie + 7] * rr5 * 0.45, rr5 * 0.42, 0, 6.3); ctx.fill();
      }
      ctx.strokeStyle = pal[0]; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(x, y + 6, 10 + me * 30, 4 + me * 9, 0, 0, 6.3); ctx.stroke();
    }
    break; }

  case 'muzzle':{
    var dxm = (f.x2 !== undefined ? f.x2 : x - 40) - x;
    var dirm = dxm < 0 ? -1 : 1;
    ctx.globalAlpha = 1 - p;
    ctx.translate(x, y); ctx.scale(dirm, 1);
    /* star flash */
    for(var iz=0;iz<6;iz++){
      var az = (iz - 2.5) * 0.34;
      var lenz = (10 + (iz % 2) * 8) * (1 - p * 0.5);
      ctx.strokeStyle = iz % 2 ? pal[0] : pal[1]; ctx.lineWidth = 2.4 - (iz % 2);
      ctx.beginPath(); ctx.moveTo(2, 0);
      ctx.lineTo(2 + Math.cos(az) * lenz, Math.sin(az) * lenz); ctx.stroke();
    }
    ctx.fillStyle = pal[0];
    ctx.beginPath(); ctx.arc(2, 0, 4.5 * (1 - p) + 1, 0, 6.3); ctx.fill();
    /* streaking tracer */
    ctx.globalAlpha = (1 - p) * 0.9;
    ctx.strokeStyle = pal[1]; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(8 + p * 30, -1); ctx.lineTo(20 + p * 40, -1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6 + p * 26, 2); ctx.lineTo(15 + p * 34, 2); ctx.stroke();
    break; }

  case 'burst':
    ctx.globalAlpha = 1 - p;
    var br = 6 + p * 34;
    ctx.strokeStyle = pal[0]; ctx.lineWidth = 3 * (1 - p) + 0.7;
    ctx.beginPath(); ctx.arc(x, y, br, 0, 6.3); ctx.stroke();
    ctx.strokeStyle = pal[1]; ctx.lineWidth = 2 * (1 - p);
    ctx.beginPath(); ctx.arc(x, y, br * 0.6, 0, 6.3); ctx.stroke();
    for(i=0;i<12;i++){
      a = i * 0.523;
      ctx.strokeStyle = pal[1]; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * br, y + Math.sin(a) * br);
      ctx.lineTo(x + Math.cos(a) * (br + 9 * (1 - p)), y + Math.sin(a) * (br + 9 * (1 - p))); ctx.stroke();
    }
    break;
  }
  ctx.restore();
}

/* aura around a transformed fighter */
function drawAura(cx, cy, pal, power, tick){
  var i, a;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var pulse = 1 + Math.sin(tick / 7) * 0.08;
  var g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 34 * power * pulse);
  g.addColorStop(0, pal[0]); g.addColorStop(0.35, pal[1]); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.42;
  ctx.beginPath(); ctx.ellipse(cx, cy, 24 * power * pulse, 34 * power * pulse, 0, 0, 6.3);
  ctx.fillStyle = g; ctx.fill();
  ctx.globalAlpha = 0.85;
  for(i=0;i<9;i++){
    a = i * 0.7 + tick * 0.05;
    var fl = 10 + Math.abs(Math.sin((tick + i * 9) / 6)) * 16 * power;
    var bx = cx + Math.cos(a) * 13 * power, by = cy + 12 - i * 1.5;
    ctx.fillStyle = i % 3 === 0 ? pal[0] : pal[1];
    ctx.beginPath();
    ctx.moveTo(bx - 2.5, by + 6);
    ctx.quadraticCurveTo(bx - 3, by - fl * 0.5, bx, by - fl);
    ctx.quadraticCurveTo(bx + 3, by - fl * 0.5, bx + 2.5, by + 6);
    ctx.fill();
  }
  for(i=0;i<6;i++){
    var sp2 = (tick * 1.4 + i * 17) % 46;
    ctx.globalAlpha = 0.8 * (1 - sp2 / 46);
    ctx.fillStyle = pal[0];
    ctx.fillRect(cx - 16 + ((i * 37) % 32), cy + 16 - sp2, 1.6, 4);
  }
  ctx.restore();
}

/* ============================================================
   INPUT
   ============================================================ */
var held = {up:false,down:false,left:false,right:false};
var repeatT = 0;
function pressDir(dx,dy){
  if(G.scene === 'gameover'){
    if(dy){ var ng = gameOverOptions().length; G.overSel = ((G.overSel||0) + dy + ng) % ng; }
    return;
  }
  if(G.scene === 'title'){
    if(dy){
      var n = titleOptions().length;
      G.titleSel = ((G.titleSel || 0) + dy + n) % n;
    }
    return;
  }
  if(G.scene === 'dialog'){
    var q = G.msg && G.msg.ask;
    if(q && q.active && dy) q.sel = (q.sel + dy + q.options.length) % q.options.length;
    return;
  }
  if(G.scene === 'field'){ if(G.mvt === 0) tryMove(dx,dy); return; }
  if(G.scene === 'battle') battleMove(dx,dy);
  else if(G.scene === 'menu') menuMove(dy || 0);
  else if(G.scene === 'shop'){
    var l = shopList().length; if(!l) return;
    G.shop.idx = (G.shop.idx + (dy||0) + l) % l;
  }
}
function pressA(){
  if(G.scene === 'gameover'){ if((G.overT||0) >= 80) gameOverConfirm(); return; }
  if(G.scene === 'title'){
    var opts = titleOptions(), sel = opts[G.titleSel || 0];
    if(!sel || sel.slot === 0){ newGame(); return; }
    if(sel.info){ if(!loadSlot(sel.slot)) newGame(); }
    return;
  }
  if(G.scene === 'dialog'){ dialogAdvance(); return; }
  if(G.scene === 'field'){ interact(); return; }
  if(G.scene === 'battle'){ battleConfirm(); return; }
  if(G.scene === 'menu'){ menuConfirm(); return; }
  if(G.scene === 'shop'){ shopConfirm(); return; }
}
function pressB(){
  if(G.scene === 'battle'){ battleCancel(); return; }
  if(G.scene === 'menu'){ mpop(); return; }
  if(G.scene === 'shop'){ G.shop = null; G.scene = 'field'; return; }
  if(G.scene === 'dialog'){ dialogAdvance(); return; }
}
function pressM(){
  if(G.scene === 'field'){ openMenu(); return; }
  if(G.scene === 'menu'){ G.menu = null; G.scene = 'field'; return; }
  if(G.scene === 'shop'){ G.shop.mode = G.shop.mode === 'buy' ? 'sell' : 'buy'; G.shop.idx = 0; return; }
}
var KEYMAP = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'
};
function setupInput(){
  window.addEventListener('keydown', function(ev){
    var k = ev.key;
    if(KEYMAP[k]){
      var dir = KEYMAP[k];
      if(!held[dir]){
        held[dir] = true;
        pressDir(dir==='left'?-1:(dir==='right'?1:0), dir==='up'?-1:(dir==='down'?1:0));
      }
      ev.preventDefault(); return;
    }
    if(k === 'z' || k === 'Z' || k === 'Enter' || k === ' '){ pressA(); ev.preventDefault(); return; }
    if(k === 'x' || k === 'X' || k === 'Backspace'){ pressB(); ev.preventDefault(); return; }
    if(k === 'm' || k === 'M' || k === 'Escape'){ pressM(); ev.preventDefault(); return; }
  });
  window.addEventListener('keyup', function(ev){
    var dir = KEYMAP[ev.key];
    if(dir) held[dir] = false;
  });
  function bindBtn(id, downFn, upFn){
    var el = document.getElementById(id);
    if(!el) return;
    function down(e){ e.preventDefault(); el.classList.add('on'); downFn(); }
    function up(e){ if(e) e.preventDefault(); el.classList.remove('on'); if(upFn) upFn(); }
    el.addEventListener('touchstart', down, {passive:false});
    el.addEventListener('touchend', up, {passive:false});
    el.addEventListener('touchcancel', up, {passive:false});
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
  }
  [['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]].forEach(function(d){
    bindBtn('btn-' + d[0], function(){
      held[d[0]] = true; pressDir(d[1], d[2]);
    }, function(){ held[d[0]] = false; });
  });
  bindBtn('btn-a', pressA); bindBtn('btn-b', pressB); bindBtn('btn-m', pressM);
}

/* ============================================================
   UPDATE + LOOP
   ============================================================ */
function updateBattle(){
  var b = G.battle;
  if(!b) return;
  updateFx();
  if(b.phase === 'intro'){ b.timer--; if(b.timer <= 0) startRound(); return; }
  if(b.phase === 'exec'){
    b.timer--;
    if(b.timer <= 0){
      if(b.msgs && b.msgs.length > 1){ b.msgs.shift(); b.timer = 34; return; }
      if(checkEnd()) return;
      advanceTurn();
    }
  }
}
function update(){
  G.tick++;
  if(G.scene === 'field'){
    updateNpcs();
    if(G.mvt > 0){ G.mvt -= (G.flags.mare && G.map.kind === 'world') ? 0.34 : 0.2; if(G.mvt < 0.001) G.mvt = 0; }
    else {
      repeatT--;
      var dx = 0, dy = 0;
      if(held.up) dy = -1; else if(held.down) dy = 1; else if(held.left) dx = -1; else if(held.right) dx = 1;
      if((dx || dy) && repeatT <= 0){ tryMove(dx,dy); repeatT = 0; }
    }
  } else if(G.scene === 'battle') updateBattle();
}
function draw(){
  if(TX) TX.clearRect(0, 0, TX.canvas.width, TX.canvas.height);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if(G.scene === 'gameover') drawGameOver();
  else if(G.scene === 'title') drawTitle();
  else if(G.scene === 'battle') drawBattle();
  else if(G.scene === 'menu') drawMenu();
  else if(G.scene === 'shop') drawShop();
  else if(G.scene === 'dialog') drawDialog();
  else drawField();
  ctx.restore();
}
function loop(){
  update(); draw();
  requestAnimationFrame(loop);
}
function resize(){
  var wrap = document.getElementById('wrap');
  var availW = wrap.clientWidth, availH = wrap.clientHeight;
  var s = Math.max(1, Math.min(availW / W, availH / H));
  var cssW = Math.floor(W * s), cssH = Math.floor(H * s);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  var tc = document.getElementById('text');
  if(tc){
    var dpr = Math.min(3, (window.devicePixelRatio || 1));
    tc.style.width = cssW + 'px'; tc.style.height = cssH + 'px';
    tc.width = Math.round(cssW * dpr); tc.height = Math.round(cssH * dpr);
    TX = tc.getContext('2d');
    txScale = tc.width / W;
  }
}
function init(){
  cv = document.getElementById('screen');
  cv.width = W; cv.height = H;
  ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  var tc0 = document.getElementById('text');
  if(tc0){ TX = tc0.getContext('2d'); txScale = 1; }
  buildTiles(); buildAltTiles(); buildSprites(); buildBookBg(); buildWorld();
  setupInput();
  window.addEventListener('resize', resize);
  resize();
  loop();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
